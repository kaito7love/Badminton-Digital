<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mat1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#floor1)"/>
  <!-- ceiling lights -->
  <g fill="#F8FAFC" opacity="0.9">
    <rect x="140" y="40" width="120" height="14" rx="7"/>
    <rect x="340" y="40" width="120" height="14" rx="7"/>
    <rect x="540" y="40" width="120" height="14" rx="7"/>
  </g>
  <g fill="none" stroke="#F8FAFC" stroke-opacity="0.25" stroke-width="3">
    <line x1="200" y1="54" x2="200" y2="260"/>
    <line x1="400" y1="54" x2="400" y2="260"/>
    <line x1="600" y1="54" x2="600" y2="260"/>
  </g>
  <!-- court -->
  <rect x="90" y="260" width="620" height="300" fill="url(#mat1)"/>
  <g stroke="#F8FAFC" stroke-width="4" fill="none">
    <rect x="120" y="290" width="560" height="240"/>
    <line x1="400" y1="290" x2="400" y2="530"/>
    <line x1="120" y1="410" x2="680" y2="410"/>
    <rect x="190" y="320" width="420" height="180"/>
  </g>
  <!-- net -->
  <rect x="395" y="330" width="10" height="150" fill="#0F172A"/>
  <rect x="392" y="330" width="16" height="8" fill="#F8FAFC"/>
</svg>
