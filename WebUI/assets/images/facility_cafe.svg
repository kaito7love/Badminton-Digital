<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgc)"/>
  <!-- window with warm glow -->
  <rect x="60" y="60" width="680" height="220" rx="10" fill="#334155" opacity="0.5"/>
  <rect x="80" y="80" width="640" height="180" rx="6" fill="#FDBA74" opacity="0.15"/>
  <!-- counter -->
  <rect x="60" y="360" width="680" height="140" rx="8" fill="#334155"/>
  <rect x="60" y="360" width="680" height="14" fill="#84CC16" opacity="0.7"/>
  <!-- stools -->
  <g fill="#22C55E" opacity="0.7">
    <circle cx="200" cy="520" r="18"/>
    <rect x="192" y="500" width="16" height="30"/>
    <circle cx="400" cy="520" r="18"/>
    <rect x="392" y="500" width="16" height="30"/>
    <circle cx="600" cy="520" r="18"/>
    <rect x="592" y="500" width="16" height="30"/>
  </g>
  <!-- cups -->
  <g fill="#F8FAFC" opacity="0.9">
    <rect x="180" y="330" width="34" height="26" rx="4"/>
    <rect x="380" y="330" width="34" height="26" rx="4"/>
    <rect x="580" y="330" width="34" height="26" rx="4"/>
  </g>
  <!-- pendant lights -->
  <g stroke="#84CC16" stroke-width="3" fill="#0F172A">
    <line x1="220" y1="0" x2="220" y2="90"/>
    <circle cx="220" cy="105" r="18"/>
    <line x1="420" y1="0" x2="420" y2="70"/>
    <circle cx="420" cy="85" r="18"/>
    <line x1="600" y1="0" x2="600" y2="100"/>
    <circle cx="600" cy="115" r="18"/>
  </g>
</svg>
