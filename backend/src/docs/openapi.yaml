      operationId: post_customers_id_merge_into_account
      description: "Gộp hồ sơ tại quầy (`:id` — chưa gắn tài khoản, có số điện thoại) vào hồ sơ của tài khoản khách tự đăng ký **cùng số** (`accountCustomerId` — hồ sơ tài khoản chưa mang số). Mọi nhân viên gọi được; chỉ gộp sau khi đã xác minh khách tại quầy, vì `POST /auth/register` không tự gộp.\n\nMột transaction: chuyển `court_sessions` / `bookings` / `sales_orders` (kể cả dòng đã xoá mềm), cộng `totalSpent`, tính lại hạng, chuyển số điện thoại sang hồ sơ tài khoản, xoá mềm hồ sơ cũ, ghi nhật ký `customer.merged`.\n\n`GET /customers` gắn `pendingAccount: { customerId, fullName, registeredAt }` vào hồ sơ đang chờ gộp. Điều kiện không khớp → 400; hồ sơ đã gộp → 409.\n\nScript chuẩn bị (chỉ khi `runWrites=true`) tự dựng cặp hồ sơ: tạo hồ sơ tại quầy bằng một số QA mới rồi đăng ký tài khoản cùng số — tốn thêm 1 lượt rate limit của `/auth/register`."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'Mã định danh bản ghi'
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
