# ⚠️ FILE SINH TỰ ĐỘNG — đừng sửa tay.
# Nguồn: postman/badminton_api_collection.json · Sinh lại: npm run docs:build
openapi: 3.0.3
info:
  title: 'Badminton Digital Management API'
  version: 1.0.0
  description: "REST API quản lý chuỗi sân cầu lông — đặt sân, phiên chơi, bán lẻ, kho, báo cáo.\n\n**Sinh tự động** từ `postman/badminton_api_collection.json` bằng `npm run docs:build`.\nĐừng sửa tay file YAML này — sửa collection rồi chạy lại lệnh trên.\n\n## Envelope\nMọi phản hồi đều có dạng `{ success, data, message, errors }`.\n\n## Xác thực\nBấm **Authorize** rồi dán access token lấy từ `POST /auth/login`\n(tài khoản mẫu: `0901111111` / `Admin@123`). Access token sống 15 phút.\n\n## Đa chi nhánh\nPhần lớn endpoint nhận header `X-Branch-Id`. Nhóm `Public` là nhóm duy nhất không cần đăng nhập."
servers:
  -
    url: 'http://localhost:5000'
    description: 'Máy cá nhân'
  -
    url: '{scheme}://{host}'
    description: 'Máy chủ khác'
    variables:
      scheme:
        default: https
        enum:
          - http
          - https
      host:
        default: 'localhost:5000'
tags:
  -
    name: '01 · Auth'
  -
    name: '02 · Public (không cần đăng nhập)'
  -
    name: '03 · Branches'
  -
    name: '04 · Courts'
  -
    name: '05 · Bookings'
  -
    name: '06 · Court Sessions'
  -
    name: '07 · Accessories (phụ kiện cho thuê/bán tại sân)'
  -
    name: '08 · Suppliers'
  -
    name: '09 · Goods Receipts (nhập hàng)'
  -
    name: '10 · Inventory'
  -
    name: '11 · Product Categories'
  -
    name: '12 · Products (hàng bán lẻ)'
  -
    name: '13 · Vouchers'
  -
    name: '14 · Sales Orders (POS bán lẻ tại quầy)'
  -
    name: '15 · My Orders (đặt hàng online — vai trò customer)'
  -
    name: '16 · Customers'
  -
    name: '17 · Employees'
  -
    name: '18 · Payments'
  -
    name: '19 · Invoices'
  -
    name: '20 · Activity Logs'
  -
    name: '21 · Reports'
  -
    name: '22 · Settings'
  -
    name: '23 · Realtime (SSE)'
security:
  -
    bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      required:
        - success
        - data
        - message
        - errors
      properties:
        success:
          type: boolean
        data:
          nullable: true
          description: 'Payload của endpoint; `null` khi lỗi'
        message:
          type: string
          nullable: true
        errors:
          nullable: true
          description: 'Danh sách lỗi validation, `null` khi thành công'
  responses:
    Success:
      description: 'Thành công'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    ValidationError:
      description: 'Dữ liệu gửi lên không hợp lệ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: 'Thiếu token hoặc token hết hạn'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: 'Vai trò không đủ quyền, hoặc sai chi nhánh'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: 'Không tìm thấy bản ghi'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
paths:
  /api/v1/auth/login:
    post:
      tags:
        - '01 · Auth'
      summary: Login
      operationId: post_auth_login
      description: "Nhận `identifier` là **số điện thoại hoặc email**. Trả access token (15 phút) + refresh token (7 ngày).\n\n⚠️ Bị giới hạn **10 lần / 15 phút / IP**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              identifier: string
              password: string
      security: []
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/me:
    get:
      tags:
        - '01 · Auth'
      summary: 'Get profile (/me)'
      operationId: get_auth_me
      description: 'Thông tin tài khoản đang đăng nhập, kèm role và bản ghi employee/customer tương ứng.'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/refresh-token:
    post:
      tags:
        - '01 · Auth'
      summary: 'Refresh token'
      operationId: post_auth_refresh_token
      description: 'Đổi refresh token lấy access token mới. Frontend `apiClient` gọi tự động khi gặp 401.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              refreshToken: string
      security: []
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/register:
    post:
      tags:
        - '01 · Auth'
      summary: 'Register (khách tự đăng ký)'
      operationId: post_auth_register
      description: "Chỉ tạo được tài khoản vai trò `customer`. Tài khoản nhân viên phải do admin tạo qua `/employees`.\n\n**Không tự gắn hồ sơ tại quầy cùng số điện thoại.** Tài khoản luôn nhận hồ sơ khách hàng mới; nếu số đã thuộc một hồ sơ khác thì hồ sơ của tài khoản để trống số điện thoại. Response giống hệt nhau dù số từng ra quầy hay chưa. Nhân viên xác minh khách rồi gộp lịch sử qua `POST /customers/:id/merge-into-account`.\n\n⚠️ Giới hạn 5 lần / giờ / IP."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fullName: 'Khách Postman'
              phone: string
              email: string
              password: Customer@123
      security: []
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/change-password:
    put:
      tags:
        - '01 · Auth'
      summary: 'Change password'
      operationId: put_auth_change_password
      description: 'Đổi mật khẩu của chính tài khoản đang đăng nhập.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              oldPassword: string
              newPassword: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - '01 · Auth'
      summary: 'Forgot password'
      operationId: post_auth_forgot_password
      description: 'Gửi email đặt lại mật khẩu (nodemailer).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: admin@badminton.com
      security: []
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/reset-password:
    post:
      tags:
        - '01 · Auth'
      summary: 'Reset password'
      operationId: post_auth_reset_password
      description: '`token` lấy từ link trong email đặt lại mật khẩu.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              token: '<token-tu-email>'
              newPassword: MatKhauMoi@123
      security: []
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/logout:
    post:
      tags:
        - '01 · Auth'
      summary: Logout
      operationId: post_auth_logout
      description: '⚠️ Chạy request này sẽ vô hiệu token đang dùng — mọi request sau đó trong lần chạy sẽ 401.'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/branches:
    get:
      tags:
        - '02 · Public (không cần đăng nhập)'
      summary: 'Danh sách chi nhánh'
      operationId: get_public_branches
      description: ""
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/courts:
    get:
      tags:
        - '02 · Public (không cần đăng nhập)'
      summary: 'Danh sách sân + bảng giá'
      operationId: get_public_courts
      description: 'Trả kèm khung giờ cao điểm và giá peak/offpeak của từng sân.'
      parameters:
        -
          name: branchId
          in: query
          required: false
          schema:
            type: string
          example: branchId
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/products:
    get:
      tags:
        - '02 · Public (không cần đăng nhập)'
      summary: 'Danh mục sản phẩm'
      operationId: get_public_products
      description: ""
      parameters:
        -
          name: branchId
          in: query
          required: false
          schema:
            type: string
          example: branchId
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  '/api/v1/public/products/{id}':
    get:
      tags:
        - '02 · Public (không cần đăng nhập)'
      summary: 'Chi tiết sản phẩm'
      operationId: get_public_products_id
      description: ""
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'Mã định danh bản ghi'
        -
          name: branchId
          in: query
          required: false
          schema:
            type: string
          example: branchId
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/availability:
    get:
      tags:
        - '02 · Public (không cần đăng nhập)'
      summary: 'Kiểm tra khung giờ trống'
      operationId: get_public_availability
      description: 'Endpoint bị dồn tải nhiều nhất khi mở bán khung giờ đẹp — cũng là mục tiêu của `k6/spike_test.js`.'
      parameters:
        -
          name: courtId
          in: query
          required: false
          schema:
            type: string
          example: courtId
        -
          name: bookingDate
          in: query
          required: false
          schema:
            type: string
          example: tomorrow
        -
          name: startTime
          in: query
          required: false
          schema:
            type: string
          example: '08:00'
        -
          name: endTime
          in: query
          required: false
          schema:
            type: string
          example: '10:00'
        -
          name: branchId
          in: query
          required: false
          schema:
            type: string
          example: branchId
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/branches:
    get:
      tags:
        - '03 · Branches'
      summary: 'Danh sách chi nhánh'
      operationId: get_branches
      description: ""
      parameters:
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courts:
    get:
      tags:
        - '04 · Courts'
      summary: 'Danh sách sân'
      operationId: get_courts
      description: 'Trả kèm `state` (AVAILABLE / IN_USE / ...) và phiên đang mở nếu có.'
      parameters:
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - '04 · Courts'
      summary: 'Tạo sân'
      operationId: post_courts
      description: 'Vai trò: `admin`, `branch_manager`.'
      parameters:
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: 'Sân QA Postman'
              peakPricePerHour: 90000
              offpeakPricePerHour: 60000
              note: 'Sân tạo bởi Postman - sẽ bị xoá ở cuối nhóm'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  '/api/v1/courts/{id}':
    get:
      tags:
        - '04 · Courts'
      summary: 'Chi tiết sân'
      operationId: get_courts_id
      description: ""
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'Mã định danh bản ghi'
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - '04 · Courts'
      summary: 'Cập nhật sân'
      operationId: put_courts_id
      description: ""
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'Mã định danh bản ghi'
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: 'Sân QA Postman (đã sửa)'
              peakPricePerHour: 95000
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - '04 · Courts'
      summary: 'Xoá sân (dọn sân QA vừa tạo)'
      operationId: delete_courts_id
      description: 'Dọn đúng bản ghi do request `Tạo sân` phía trên sinh ra.'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'Mã định danh bản ghi'
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courts/layout:
    put:
      tags:
        - '04 · Courts'
      summary: 'Lưu sơ đồ mặt bằng sân'
      operationId: put_courts_layout
      description: "Toạ độ sân trên sơ đồ mặt bằng. Vai trò: `admin`, `branch_manager`.\n\n🔴 **Endpoint này ghi ra FILE trên đĩa** (`backend/public/layouts/branch-<id>.json`), không ghi vào CSDL. Nghĩa là chạy trên CSDL test **vẫn ghi đè sơ đồ thật** — CSDL dùng một lần không cô lập được nó. Sao lưu file đó trước khi chạy bộ `runDestructive`, hoặc khôi phục bằng `git checkout -- backend/public/layouts/` sau khi chạy.\n\n⚠️ Mỗi sân trong `courts` phải có **`courtName` khớp đúng tên sân thật của chi nhánh** (không phải `id`) — sai tên là API trả 400 kèm danh sách tên không khớp. Mỗi `zones` cần `label`, `x`, `y`, `w`, `h`; `cls` nhận một trong `parking｜wait｜counter｜office｜show｜entrance｜back｜custom`."
      parameters:
        -
          name: X-Branch-Id
          in: header
          required: false
          schema:
            type: integer
          description: 'Chi nhánh đang thao tác. `admin` có thể gửi bất kỳ chi nhánh nào; `employee`/`branch_manager` bị khoá vào chi nhánh của mình. Bỏ trống thì dùng chi nhánh của tài khoản. Chỉ tài khoản nhân viên được gửi header này — tài khoản `customer` gửi sẽ nhận 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              canvas:
                width: 1200
                height: 800
              courts:
                -
                  courtName: 'Sân số 1 (Thường)'
                  x: 40
                  y: 40
                  rotation: 0
              zones:
                -
                  label: 'Bãi xe'
                  x: 900
                  y: 40
                  w: 240
                  h: 180
                  cls: parking
                  rotation: 0
      responses:
        '200':
