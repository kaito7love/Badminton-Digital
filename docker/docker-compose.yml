services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: badminton_digital_management
      MYSQL_USER: bp_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Chỉ bind vào 127.0.0.1 — vẫn debug được từ máy host (MySQL
      # Workbench/DBeaver trỏ localhost:3306), nhưng không mở ra mạng ngoài
      # như trước (0.0.0.0:3306).
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      # .env gốc để DB_HOST=localhost cho lúc chạy npm run dev ngoài Docker —
      # trong mạng compose phải trỏ đúng tên service "mysql", ghi đè riêng
      # biến này, các biến khác (JWT secret, mail...) vẫn lấy từ env_file.
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
