# Chạy cả hệ thống trên một máy: `cd docker && docker compose up --build`.
# Cần docker/.env (chép từ docker/.env.example) và backend/.env (JWT secret...).
# Bản demo công khai deploy bằng Render + Aiven — xem docs/DeploymentGuide.md.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: badminton_digital_management
      MYSQL_USER: bp_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong docker/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Đặt DB_ROOT_PASSWORD trong docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Chỉ bind 127.0.0.1 — xem DB từ máy host (Workbench/DBeaver) được, nhưng
      # không mở ra mạng ngoài. Mặc định 3307 để không đụng MySQL cài sẵn ở 3306.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      # 127.0.0.1 (TCP), không dùng "localhost" (socket): lúc khởi tạo lần đầu,
      # entrypoint của image mysql chạy một server tạm chỉ nghe socket — ping qua
      # socket đã "khoẻ" trong khi backend nối TCP vẫn bị ECONNREFUSED.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    # `environment:` đè lên env_file: backend/.env viết cho `npm run dev` ngoài
    # Docker (DB_HOST=localhost, NODE_ENV=development...), trong compose phải trỏ
    # đúng service mysql, đúng user mà service đó tạo, và luôn chạy production.
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: badminton_digital_management
      DB_USER: bp_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      # Đúng 1 proxy đứng trước backend: nginx của service frontend (AUTH-02).
      # Đặt thêm reverse proxy TLS trước nginx thì đổi thành "2".
      TRUST_PROXY_HOPS: "1"
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      # Sơ đồ mặt bằng sân sửa qua giao diện — sống qua `up --build` (DEP-03).
      - layouts_data:/app/public/layouts
    depends_on:
      mysql:
        condition: service_healthy
    # Không publish cổng: chỉ nginx (service frontend) gọi vào, qua mạng nội bộ
    # compose (DEP-07). Cần gọi thẳng từ máy host để debug thì thêm
    # `ports: ["127.0.0.1:5000:5000"]` — đừng bind 0.0.0.0.
    healthcheck:
      # Liveness: chỉ biết process còn sống. Readiness chạm DB là DEP-10 (nhóm 6).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Lần đầu (DB trống) entrypoint chạy đủ migration trước khi server nghe cổng.
      start_period: 600s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Chỉ 127.0.0.1 (DEP-07). Mở ra internet thì đặt reverse proxy có TLS phía
      # trước (Caddy, nginx + Certbot...) trỏ vào cổng này, và đặt
      # TRUST_PROXY_HOPS=2 cho backend (thêm một hop).
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  mysql_data:
  layouts_data:
