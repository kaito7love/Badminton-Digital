services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: badminton_digital_management
      MYSQL_USER: bp_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build:
      context: ../backend
    env_file: ../backend/.env
    depends_on:
      - mysql
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
