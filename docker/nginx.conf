# nginx trong container frontend của cụm docker compose (DEP-01):
# phục vụ bản build React, proxy API sang service "backend" cùng mạng compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Backend đặt `trust proxy` = 1 hop và lấy IP ở cuối X-Forwarded-For — chính
    # là $remote_addr nginx nối vào, client không giả được.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (bảng sân realtime): không đệm, không cắt kết nối dài. Không ghi
    # access log: token đăng nhập của EventSource nằm trong query string.
    location /api/v1/realtime/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        # Khai proxy_set_header ở đây thì nginx KHÔNG kế thừa các dòng ở cấp
        # server nữa — phải lặp lại đủ.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    # Luồng SSE của thi đấu qua cổng nối (…/tournaments/:id/stream, …/sessions/:id/stream): không đệm, không cắt kết nối
    # dài, không ghi access log (token EventSource nằm trong query). Regex đứng trước tiền tố /api/ nên được chọn trước.
    location ~ ^/api/v1/competition/.+/stream$ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        client_max_body_size 10m;
    }

    # Sơ đồ mặt bằng sân (JSON do backend phục vụ)
    location /static/ {
        proxy_pass http://backend:5000;
    }

    # Swagger UI — chỉ có khi backend bật ENABLE_API_DOCS=true
    location /api-docs {
        proxy_pass http://backend:5000;
    }

    # File build của Vite mang hash trong tên — cache lâu dài.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Header bảo mật (R9, kế hoạch 35) — GIỮ ĐỒNG BỘ với backend/src/utils/securityHeaders.js. Lặp lại ở từng location
        # vì nginx không kế thừa add_header cấp server khi location có add_header riêng. Không có HSTS: compose chỉ
        # bind 127.0.0.1 bằng HTTP, TLS do reverse proxy phía trước — nơi đó mới bật Strict-Transport-Security.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.vietqr.io; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # SPA: route của React (F5 ở /courts, link đặt lại mật khẩu...) trả index.html.
    location / {
        add_header Cache-Control "no-cache";
        # Header bảo mật (R9, kế hoạch 35) — GIỮ ĐỒNG BỘ với backend/src/utils/securityHeaders.js. Lặp lại ở từng location
        # vì nginx không kế thừa add_header cấp server khi location có add_header riêng. Không có HSTS: compose chỉ
        # bind 127.0.0.1 bằng HTTP, TLS do reverse proxy phía trước — nơi đó mới bật Strict-Transport-Security.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.vietqr.io; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri /index.html;
    }
}
