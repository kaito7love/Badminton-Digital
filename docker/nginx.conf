# nginx trong container frontend của cụm docker compose (DEP-01):
# phục vụ bản build React, proxy API sang service "backend" cùng mạng compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Backend đặt `trust proxy` = 1 hop và lấy IP ở cuối X-Forwarded-For — chính
    # là $remote_addr nginx nối vào, client không giả được.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (bảng sân realtime): không đệm, không cắt kết nối dài. Không ghi
    # access log: token đăng nhập của EventSource nằm trong query string.
    location /api/v1/realtime/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        # Khai proxy_set_header ở đây thì nginx KHÔNG kế thừa các dòng ở cấp
        # server nữa — phải lặp lại đủ.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        client_max_body_size 10m;
    }

    # Sơ đồ mặt bằng sân (JSON do backend phục vụ)
    location /static/ {
        proxy_pass http://backend:5000;
    }

    # Swagger UI — chỉ có khi backend bật ENABLE_API_DOCS=true
    location /api-docs {
        proxy_pass http://backend:5000;
    }

    # File build của Vite mang hash trong tên — cache lâu dài.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: route của React (F5 ở /courts, link đặt lại mật khẩu...) trả index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
