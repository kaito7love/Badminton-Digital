      type: object
      nullable: true
      additionalProperties: false
      required: [teamId, players]
      properties:
        teamId: { type: string, nullable: true, description: 'Đội của giải; null với trận giao lưu' }
        players: { type: array, items: { $ref: '#/components/schemas/PublicPlayerRef' } }
    PublicMatchView: &publicMatchView
