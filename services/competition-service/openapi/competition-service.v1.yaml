        teamB: { $ref: '#/components/schemas/PublicTeam' }
        scoring: { $ref: '#/components/schemas/ScoringObject' }
        games: { type: array, items: { type: array, items: { type: integer } } }
        outcome: { type: string, nullable: true, enum: [normal, walkover, retired, null] }
        winnerSide: { type: string, nullable: true, enum: [A, B, null] }
        status: { type: string, enum: [scheduled, in_play, completed, cancelled, ended] }
        courtRef: { type: string, nullable: true }
        calledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        live: { $ref: '#/components/schemas/MatchLive' }
