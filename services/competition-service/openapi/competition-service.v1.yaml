            status: { type: string, enum: [open, closed] }
            format: { type: string, enum: [doubles, singles] }
            mode: { type: string, enum: [balanced, level, random] }
            rated: { type: boolean }
            rounds: { type: integer }
        serverTime: { type: string, format: date-time }
        courts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [courtRef, status, match]
            properties:
              courtRef: { type: string }
              status: { type: string, enum: [busy, free] }
              match: { $ref: '#/components/schemas/PublicMatchViewOrNull' }
        upcoming:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [courtRef, sideA, sideB]
            properties:
              courtRef: { type: string }
              sideA: { type: array, items: { $ref: '#/components/schemas/PublicPlayerRef' } }
              sideB: { type: array, items: { $ref: '#/components/schemas/PublicPlayerRef' } }
        queue:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [position, player, gamesPlayed, waitingSince, next]
            properties:
              position: { type: integer }
              player: { $ref: '#/components/schemas/PublicPlayerRef' }
              gamesPlayed: { type: integer }
              waitingSince: { type: string, format: date-time, nullable: true }
              next: { type: boolean }
        recent: { type: array, items: { $ref: '#/components/schemas/PublicMatchView' } }
        counts:
          type: object
          additionalProperties: false
          required: [present, onCourt, waiting]
          properties:
            present: { type: integer }
            onCourt: { type: integer }
            waiting: { type: integer }
    SelfRegisterInput:
      type: object
      additionalProperties: false
      properties:
        partner:
          type: object
          additionalProperties: false
          description: 'Giải cặp cố định: đúng MỘT trong playerId / guest. Giải đăng ký từng người: không gửi.'
          properties:
            playerId: { type: string, format: uuid, description: 'Người đã có hồ sơ (chọn từ /v1/me/partners)' }
            guest:
              type: object
              additionalProperties: false
              description: 'Người chưa có tài khoản — tạo hồ sơ khách + điểm tạm chờ nhân viên xác nhận'
              required: [name, phone, gender, level]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone: { type: string, minLength: 9, maxLength: 20, description: 'SĐT di động VN, nhận 0912345678 / 0912 345 678 / +84912345678' }
                gender: { $ref: '#/components/schemas/Gender' }
                level: { type: string, enum: [beginner, weak, tb_minus, tb, tb_plus, kha], description: 'Cùng 6 nhãn "chấm nhanh" của nhân viên' }
    PartnerCandidate:
      type: object
      additionalProperties: false
      required: [id, name, nickname, gender, rated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nickname: { type: string, nullable: true }
        gender: { type: string, nullable: true, enum: [male, female, null] }
        rated: { type: boolean }
    PublicSessionSignupSummary:
      type: object
      additionalProperties: false
      required: [open, maxPlayers, registered, waitlisted, spotsLeft]
      properties:
        open: { type: boolean, description: 'Buổi còn mở (status = open) — đóng rồi thì không đăng ký / huỷ được' }
        maxPlayers: { type: integer, nullable: true, description: 'Sức chứa; null = không giới hạn' }
        registered: { type: integer, description: 'Số người đã đăng ký giữ chỗ (chưa điểm danh)' }
        waitlisted: { type: integer, description: 'Số người đang chờ' }
        spotsLeft: { type: integer, nullable: true, description: 'maxPlayers − (đã đăng ký ∪ đang có mặt); null khi không giới hạn' }
    PublicSessionMe:
      type: object
      nullable: true
      additionalProperties: false
      required: [status, waitlistPosition, canCancel]
      properties:
        status: { type: string, enum: [registered, waitlisted, attended] }
        waitlistPosition: { type: integer, nullable: true }
        canCancel: { type: boolean, description: 'Chỉ khi buổi còn mở và chưa điểm danh' }
    PublicSessionSignupEntry:
      type: object
      additionalProperties: false
      required: [id, status, waitlistPosition, player, mine]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [registered, waitlisted, attended] }
        waitlistPosition: { type: integer, nullable: true }
        player: { $ref: '#/components/schemas/PublicPlayerRef' }
        mine: { type: boolean }
    MySession:
      type: object
      additionalProperties: false
      required: [session, signup]
      properties:
        session: { $ref: '#/components/schemas/PublicSession' }
        signup:
          type: object
          additionalProperties: false
          required: [status, waitlistPosition]
          properties:
            status: { type: string, enum: [registered, waitlisted] }
            waitlistPosition: { type: integer, nullable: true }
    StaffSignup:
      type: object
      additionalProperties: false
      required: [id, playerId, name, gender, status, waitlistPosition, signedUpAt, present, rating, flags]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        status: { type: string, enum: [registered, waitlisted, attended] }
        waitlistPosition: { type: integer, nullable: true }
        signedUpAt: { type: string, format: date-time }
        present: { type: boolean, description: 'Đang có mặt (đã điểm danh, chưa rời)' }
        rating: { type: number, nullable: true, description: 'Điểm ở nội dung của buổi; null = chưa có điểm' }
        flags: { type: array, items: { type: string } }
