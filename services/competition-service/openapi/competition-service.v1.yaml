        teamId: { type: string, format: uuid }
        rank: { type: integer }
        played: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        gamesWon: { type: integer }
        gamesLost: { type: integer }
        gameDiff: { type: integer }
        pointsWon: { type: integer }
        pointsLost: { type: integer }
        pointDiff: { type: integer }
        team: { $ref: '#/components/schemas/Team' }

    Placement:
      type: object
      additionalProperties: false
      required: [teamId, from, to, label, reachedKnockout, wins, players]
      properties:
        teamId: { type: string, format: uuid }
        from: { type: integer }
        to: { type: integer }
        label: { type: string }
        reachedKnockout: { type: boolean }
        wins: { type: integer }
        players:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, nullable: true }

    FinalizeResult:
      type: object
      required: [placements, ratingChanges, rankingPoints, rankingEligible, rankingReason]
