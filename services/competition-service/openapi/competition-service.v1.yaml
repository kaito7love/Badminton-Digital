        registered: { type: integer, description: 'Số NGƯỜI đã đăng ký chính thức' }
        waitlisted: { type: integer, description: 'Số NGƯỜI đang chờ' }
        maxEntries: { type: integer, nullable: true, description: 'Giới hạn tính theo người' }
