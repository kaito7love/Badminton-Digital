openapi: 3.0.3
info:
  title: competition-service API
  version: 0.5.0
  description: |
    Dịch vụ Thi đấu của Badminton Digital — chấm trình, điểm trình, bảng xếp hạng, xếp cặp.
    Bước 1: người chơi, chấm trình, BXH trình độ, thuật toán xếp cặp. Bước 2: trận đấu, giải đấu, BXH thành tích, thống kê.
    Bước 3: buổi giao lưu (điểm danh, xếp sân trống, màn hình lớn, đóng buổi).
    Plan 19: bấm điểm trực tiếp từng pha cầu, luồng SSE đẩy tỉ số lên màn hình TV.

    Xác thực: service token ES256 (gateway của app chính ký, sống ≤ 5 phút) — xem docs/01-kien-truc.md mục 6.
    Envelope: { success, data, message, errors } giống app chính, thêm `code` khi lỗi.
    Mọi POST có tác dụng phụ bắt buộc header Idempotency-Key.
servers:
  - url: /
security:
  - serviceToken: []
tags:
  - name: player
  - name: rating
  - name: ranking
  - name: matchmaking
  - name: match
  - name: tournament
  - name: session
  - name: public
  - name: ops

paths:
  /v1/me:
    get:
      tags: [player]
      summary: Hồ sơ + điểm của chính người gọi (claim `player`); lần đầu tự tạo hồ sơ (JIT)
      description: 'Scope: rating:self'
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [player]
      summary: Sửa hồ sơ của mình
      description: 'Scope: rating:self. Giới tính chỉ sửa được khi chưa có trận tính điểm.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }

  /v1/me/assessments:
    post:
      tags: [rating]
      summary: Tự chấm trình (form 12 tiêu chí)
      description: 'Scope: rating:self. Bị chặn (409 SELF_ASSESSMENT_LOCKED) khi đã có trận tính điểm hoặc đã được nhân viên chấm.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rubricVersion, answers]
              properties:
                rubricVersion: { type: string, example: v1 }
                profile: { $ref: '#/components/schemas/ProfilePatch' }
                answers: { $ref: '#/components/schemas/Answers' }
      responses:
        '201': { $ref: '#/components/responses/AssessmentSubmitted' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/by-ref/{externalRef}:
    parameters: [{ $ref: '#/components/parameters/ExternalRef' }]
    put:
      tags: [player]
      summary: Tạo hoặc cập nhật hồ sơ theo mã ngoài (vd bd:customer:123)
      description: 'Scope: player:write. PUT tự nhiên idempotent — không cần Idempotency-Key.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Player' }
        '201': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [player]
      summary: Tra hồ sơ theo mã ngoài (hồ sơ đã gộp → trả hồ sơ đích)
      description: 'Scope: rating:read'
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/lookup:
    post:
      tags: [player]
      summary: Tra hàng loạt theo mã ngoài (≤ 100) — tránh N+1 qua mạng
      description: 'Scope: rating:read. Chỉ đọc — không cần Idempotency-Key.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [externalRefs]
              properties:
                externalRefs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/ExternalRefValue' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, missing]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [externalRef, player]
                              properties:
                                externalRef: { type: string }
                                player: { $ref: '#/components/schemas/PlayerView' }
                          missing: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }

  /v1/players:
    get:
      tags: [player]
      summary: Danh sách / tìm người chơi
      description: 'Scope: rating:read'
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: gender, in: query, schema: { $ref: '#/components/schemas/Gender' } }
        - { name: status, in: query, schema: { type: string, enum: [active, merged, anonymized] } }
        - { name: discipline, in: query, schema: { $ref: '#/components/schemas/Discipline' } }
        - { name: minRating, in: query, schema: { type: number, minimum: 1, maximum: 7 } }
        - { name: maxRating, in: query, schema: { type: number, minimum: 1, maximum: 7 } }
        - { name: verified, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: flag, in: query, schema: { type: string, enum: [unverified, needs_verification, quick, pending_review] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/PlayerView' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [player]
      summary: Chi tiết người chơi (bản đầy đủ cho nhân viên, kèm vị trí BXH)
      description: 'Scope: rating:read'
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [player]
      summary: Nhân viên sửa hồ sơ (kể cả giới tính sau khi đã có trận — có nhật ký)
      description: 'Scope: player:write'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/public:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [player]
      summary: Hồ sơ rút gọn theo quyền riêng tư
      description: 'Scope: ranking:read. Không được xem → 404 (không lộ hồ sơ ẩn có tồn tại).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerPublicView' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/merge:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [player]
      summary: Gộp hồ sơ nguồn vào hồ sơ này (đích)
      description: 'Scope: player:write'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourcePlayerId]
              properties:
                sourcePlayerId: { type: string, format: uuid }
      responses:
        '200':
          description: Đã gộp
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [player, merged]
                        properties:
                          player: { $ref: '#/components/schemas/PlayerView' }
                          merged: { type: object }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/anonymize:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [player]
      summary: Ẩn danh hoá (giữ điểm, sổ điểm, kết quả trận)
      description: 'Scope: player:write'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/rating-history:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [rating]
      summary: Sổ điểm (để vẽ biểu đồ điểm theo thời gian)
      description: 'Scope: ranking:read / rating:read / rating:self (theo quyền riêng tư)'
      parameters:
        - { name: discipline, in: query, schema: { $ref: '#/components/schemas/Discipline' } }
        - { $ref: '#/components/parameters/Page' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/RatingChange' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/ranking:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [ranking]
      summary: Vị trí trên các BXH trình độ (kèm vị trí dự kiến nếu chưa đủ điều kiện)
      description: 'Scope: ranking:read'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [playerId, rating, points]
                        properties:
                          playerId: { type: string, format: uuid }
                          rating: { $ref: '#/components/schemas/RankingPositions' }
                          points: { $ref: '#/components/schemas/PointsPositions' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/assessments:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [rating]
      summary: Nhân viên chấm đủ form
      description: 'Scope: rating:assess (người chưa có trận) / rating:assess:any. Người đã có trận: chỉ lưu hồ sơ (status recorded), điểm không đổi.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rubricVersion, answers]
              properties:
                rubricVersion: { type: string }
                profile: { $ref: '#/components/schemas/ProfilePatch' }
                answers: { $ref: '#/components/schemas/Answers' }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/AssessmentSubmitted' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/assessments/quick:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [rating]
      summary: Chấm nhanh một nhãn (khách vãng lai, chỉ khi chưa có điểm)
      description: 'Scope: rating:assess'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [level]
              properties:
                level: { type: string, enum: [beginner, weak, tb_minus, tb, tb_plus, kha] }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/AssessmentSubmitted' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/assessments/ai:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [rating]
      summary: Bài chấm từ video-analysis-service — luôn chờ duyệt
      description: 'Scope: assessment:submit-ai'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rubricVersion, answers]
              properties:
                rubricVersion: { type: string }
                answers: { $ref: '#/components/schemas/AnswersNullable' }
                confidence:
                  type: object
                  additionalProperties: { type: number, minimum: 0, maximum: 1 }
                metrics: { type: object }
                modelVersion: { type: string, maxLength: 40 }
                evidenceRef: { type: string, maxLength: 128 }
                matchId: { type: string, format: uuid }
      responses:
        '201':
          description: Đã nhận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [assessment]
                        properties:
                          assessment: { $ref: '#/components/schemas/Assessment' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/verify:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [rating]
      summary: Xác nhận trình cho một nội dung
      description: 'Scope: rating:assess:any'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [discipline]
              properties:
                discipline: { $ref: '#/components/schemas/Discipline' }
      responses:
        '200': { $ref: '#/components/responses/Player' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/rating-adjustments:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    post:
      tags: [rating]
      summary: Quản lý chỉnh điểm tay (bắt buộc lý do ≥ 10 ký tự)
      description: 'Scope: rating:adjust'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [discipline, newRating, reason]
              properties:
                discipline: { $ref: '#/components/schemas/Discipline' }
                newRating: { type: number, minimum: 1, maximum: 7, description: "Làm tròn 3 số lẻ phía server (không dùng multipleOf — số thực làm ajv từ chối nhầm, vd 3.9)" }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '201':
          description: Đã chỉnh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [player, change]
                        properties:
                          player: { $ref: '#/components/schemas/PlayerView' }
                          change:
                            type: object
                            required: [discipline, before, after]
                            properties:
                              discipline: { $ref: '#/components/schemas/Discipline' }
                              before: { type: number, nullable: true }
                              after: { type: number }
        default: { $ref: '#/components/responses/Error' }

  /v1/rubrics/current:
    get:
      tags: [rating]
      summary: Bộ tiêu chí hiện hành (để vẽ form)
      description: 'Scope: rating:self / rating:read / rating:assess'
      responses:
        '200': { $ref: '#/components/responses/Rubric' }
        default: { $ref: '#/components/responses/Error' }

  /v1/rubrics/{version}:
    get:
      tags: [rating]
      summary: Bộ tiêu chí theo phiên bản
      parameters:
        - { name: version, in: path, required: true, schema: { type: string, pattern: '^v[0-9]+$' } }
      responses:
        '200': { $ref: '#/components/responses/Rubric' }
        default: { $ref: '#/components/responses/Error' }

  /v1/assessments/preview:
    post:
      tags: [rating]
      summary: Tính thử điểm từ câu trả lời — KHÔNG lưu (bước "Xem lại" của form)
      description: 'Scope: rating:self / rating:assess. Chỉ đọc — không cần Idempotency-Key.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rubricVersion, answers]
              properties:
                rubricVersion: { type: string }
                answers: { $ref: '#/components/schemas/Answers' }
                source: { type: string, enum: [self, staff], description: 'Chỉ nhân viên được chọn staff' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssessmentResult' }
        default: { $ref: '#/components/responses/Error' }

  /v1/assessments:
    get:
      tags: [rating]
      summary: Hàng chờ duyệt (bài AI chờ duyệt / bài tự chấm cần xác nhận)
      description: 'Scope: rating:assess:any'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [applied, recorded, pending_review, rejected, superseded] } }
        - { name: flag, in: query, schema: { type: string, enum: [needs_verification] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  allOf:
                                    - $ref: '#/components/schemas/Assessment'
                                    - type: object
                                      properties:
                                        playerName: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }

  /v1/assessments/{id}/review:
    post:
      tags: [rating]
      summary: Duyệt / từ chối bài chấm (có thể điền / sửa tiêu chí)
      description: 'Scope: rating:assess:any'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                answers: { $ref: '#/components/schemas/Answers' }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [assessment, applied, player]
                        properties:
                          assessment: { $ref: '#/components/schemas/Assessment' }
                          applied: { $ref: '#/components/schemas/AssessmentOrNull' }
                          player: { $ref: '#/components/schemas/PlayerView' }
        default: { $ref: '#/components/responses/Error' }

  /v1/leaderboards/rating:
    get:
      tags: [ranking]
      summary: BXH trình độ
      description: |
        Scope: ranking:read. Điều kiện lên bảng: ≥ 5 trận tính điểm hoặc đã xác nhận, có trận trong 12 tháng,
        không để chế độ `hidden`. Người xem chưa đăng nhập thấy dòng của người `members` bị che tên.
      parameters:
        - { name: category, in: query, required: true, schema: { type: string, enum: [MS, WS, MD, WD] } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { name: ageGroup, in: query, schema: { type: string, enum: [U18, 18-34, 35-44, 45-54, 55+] } }
        - { name: level, in: query, schema: { type: string, enum: [beginner, weak, tb_minus, tb, tb_plus, kha, kha_gioi, ban_chuyen, chuyen_nghiep] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            required: [category, label]
                            properties:
                              category: { type: string }
                              label: { type: string }
                              items: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/teams:
    post:
      tags: [matchmaking]
      summary: Ghép đồng đội ngẫu nhiên nhưng cân bằng (không lưu gì)
      description: 'Scope: matchmaking:compute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [players]
              properties:
                mode: { type: string, enum: [doubles, mixed] }
                seed: { type: string, maxLength: 64 }
                tolerance: { type: number, minimum: 0, maximum: 1 }
                maxPartnerGap: { type: number, minimum: 0, nullable: true }
                recentPartners:
                  type: array
                  items: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
                players:
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required: [id, rating]
                    properties:
                      id: { type: string }
                      rating: { type: number }
                      gender: { $ref: '#/components/schemas/Gender' }
                      registeredAt: { type: string, format: date-time }
                      position: { type: string, enum: [front, back, both] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [seed, teams, waitlist, stats]
                        properties:
                          seed: { type: string }
                          teams:
                            type: array
                            items:
                              type: object
                              required: [players, teamRating]
                              properties:
                                players: { type: array, items: { type: string } }
                                teamRating: { type: number }
                          waitlist:
                            type: array
                            items:
                              type: object
                              required: [playerId, reason]
                              properties:
                                playerId: { type: string }
                                reason: { type: string, enum: [ODD_COUNT, GENDER_IMBALANCE] }
                          stats:
                            type: object
                            required: [teamRatingStdDev, teamRatingRange, baselineRandomStdDev, alternativesConsidered]
                            properties:
                              teamRatingStdDev: { type: number }
                              teamRatingRange: { type: number }
                              baselineRandomStdDev: { type: number }
                              alternativesConsidered: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/groups:
    post:
      tags: [matchmaking]
      summary: Chia bảng (rải hạt giống / theo trình)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teams, groupCount]
              properties:
                teams:
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required: [id, rating]
                    properties:
                      id: { type: string }
                      rating: { type: number }
                groupCount: { type: integer, minimum: 1, maximum: 64 }
                mode: { type: string, enum: [seeded, level] }
                seed: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [seed, groups]
                        properties:
                          seed: { type: string }
                          groups:
                            type: array
                            items:
                              type: object
                              required: [groupNo, teams]
                              properties:
                                groupNo: { type: integer }
                                teams:
                                  type: array
                                  items:
                                    type: object
                                    required: [id, pot]
                                    properties:
                                      id: { type: string }
                                      pot: { type: integer, nullable: true }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/round-robin:
    post:
      tags: [matchmaking]
      summary: Lịch vòng tròn (mỗi cặp gặp nhau đúng một lần)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teamIds]
              properties:
                teamIds: { type: array, minItems: 2, maxItems: 64, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [rounds]
                        properties:
                          rounds:
                            type: array
                            items:
                              type: object
                              required: [round, matches, bye]
                              properties:
                                round: { type: integer }
                                matches: { type: array, items: { type: array, items: { type: string } } }
                                bye: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/schedule:
    post:
      tags: [matchmaking]
      summary: Xếp trận vào lượt theo số sân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matches, courts]
              properties:
                courts: { type: integer, minimum: 1, maximum: 64 }
                matchMinutes: { type: integer, minimum: 1, maximum: 240 }
                matches:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    required: [id, teams]
                    properties:
                      id: { type: string }
                      teams: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
                      groupNo: { type: integer }
                      round: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [slots, estimate]
                        properties:
                          slots:
                            type: array
                            items:
                              type: object
                              required: [slotNo, matches]
                              properties:
                                slotNo: { type: integer }
                                matches: { type: array, items: { type: string } }
                          estimate:
                            type: object
                            required: [matches, slots, minutes]
                            properties:
                              matches: { type: integer }
                              slots: { type: integer }
                              minutes: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/bracket:
    post:
      tags: [matchmaking]
      summary: Sơ đồ loại trực tiếp (hạt giống / từ vòng bảng)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entrants]
              properties:
                mode: { type: string, enum: [seeded, from_groups] }
                seedCount: { type: integer, minimum: 1, nullable: true }
                seed: { type: string, maxLength: 64 }
                entrants:
                  type: array
                  minItems: 2
                  maxItems: 128
                  description: Theo thứ tự mạnh → yếu
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                      group: { type: string }
                      groupRank: { type: integer, enum: [1, 2] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [seed, size, rounds, positions, firstRound, constraintLevel]
                        properties:
                          seed: { type: string }
                          size: { type: integer }
                          rounds: { type: integer }
                          positions: { type: array, items: { type: string, nullable: true } }
                          firstRound:
                            type: array
                            items:
                              type: object
                              required: [match, a, b, bye]
                              properties:
                                match: { type: integer }
                                a: { type: string, nullable: true }
                                b: { type: string, nullable: true }
                                bye: { type: boolean }
                          constraintLevel: { type: integer, nullable: true }
        default: { $ref: '#/components/responses/Error' }

  /v1/matchmaking/session-round:
    post:
      tags: [matchmaking]
      summary: Xếp sân giao lưu cho các sân đang trống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [players, courts]
              properties:
                courts: { type: array, maxItems: 64, items: { type: string } }
                format: { type: string, enum: [doubles, singles] }
                mode: { type: string, enum: [balanced, level, random] }
                seed: { type: string, maxLength: 64 }
                now: { type: string, format: date-time }
                history:
                  type: object
                  additionalProperties: false
                  properties:
                    partners: { type: array, items: { type: array, minItems: 2, maxItems: 3 } }
                    opponents: { type: array, items: { type: array, minItems: 2, maxItems: 3 } }
                players:
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required: [id, rating]
                    properties:
                      id: { type: string }
                      rating: { type: number }
                      gamesPlayed: { type: integer, minimum: 0, description: 'Số trận dùng để ưu tiên (đã đánh + số trận được bù khi đến muộn)' }
                      newcomer: { type: boolean, description: 'Chưa đánh trận nào trong buổi — không bị kéo lên trước người chờ lâu hơn' }
                      waitingSince: { type: string, format: date-time }
                      joinedAt: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [seed, assignments, waiting, order]
                        properties:
                          seed: { type: string }
                          order: { type: array, description: 'Thứ tự ưu tiên đầy đủ của mọi người được gửi lên', items: { type: string } }
                          assignments:
                            type: array
                            items:
                              type: object
                              required: [court, sideA, sideB, teamRatings]
                              properties:
                                court: { type: string }
                                sideA: { type: array, items: { type: string } }
                                sideB: { type: array, items: { type: string } }
                                teamRatings: { type: array, items: { type: number } }
                          waiting: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }

  /v1/events:
    post:
      tags: [ops]
      summary: Nhận sự kiện từ hệ thống khác (bd.customer.updated / merged / deleted)
      description: Xác thực bằng chữ ký HMAC (X-Event-Source, X-Timestamp, X-Signature), không dùng service token.
      security: [{ eventSignature: [] }]
      parameters:
        - { name: X-Event-Source, in: header, required: true, schema: { type: string } }
        - { name: X-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
        - { name: X-Signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                specversion: { type: string }
                id: { type: string, maxLength: 64 }
                type: { type: string, maxLength: 100 }
                source: { type: string }
                time: { type: string, format: date-time }
                data: { type: object }
      responses:
        '200':
          description: Đã nhận (kể cả trùng lặp)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [eventId, status]
                        properties:
                          eventId: { type: string }
                          status: { type: string, enum: [processed, ignored, duplicate] }
                          result: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/ops/outbox:
    get:
      tags: [ops]
      summary: Xem sự kiện chưa giao được (mặc định trạng thái dead)
      description: 'Scope: ops:admin'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, dead, no_target] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Paged' }
        default: { $ref: '#/components/responses/Error' }

  /v1/ops/outbox/{id}/replay:
    post:
      tags: [ops]
      summary: Gửi lại một sự kiện dead
      description: 'Scope: ops:admin'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/stats:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [player]
      summary: Thống kê (thắng / thua, phong độ, thành tích) — chỉ trận đã chốt
      description: 'Scope: ranking:read / rating:read / rating:self (theo quyền riêng tư)'
      parameters:
        - { name: discipline, in: query, schema: { $ref: '#/components/schemas/Discipline' } }
        - { name: context, in: query, schema: { type: string, enum: [tournament, session] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [playerId, items]
                        properties:
                          playerId: { type: string, format: uuid }
                          items: { type: array, items: { $ref: '#/components/schemas/PlayerStats' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/matches:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [match]
      summary: Lịch sử trận (đã chốt) hoặc trận sắp tới
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [history, upcoming] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/MatchPage' }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/partners:
    parameters: [{ $ref: '#/components/parameters/PlayerId' }]
    get:
      tags: [match]
      summary: 5 đồng đội hay đánh cặp nhất + tỉ lệ thắng khi đánh cùng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [playerId, items]
                        properties:
                          playerId: { type: string, format: uuid }
                          items:
                            type: array
                            items:
                              type: object
                              required: [playerId, name, matches, wins, winRate]
                              properties:
                                playerId: { type: string, format: uuid }
                                name: { type: string, nullable: true }
                                matches: { type: integer }
                                wins: { type: integer }
                                winRate: { type: number }
        default: { $ref: '#/components/responses/Error' }

  /v1/players/{id}/head-to-head/{otherId}:
    parameters:
      - { $ref: '#/components/parameters/PlayerId' }
      - { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [match]
      summary: Đối đầu hai người
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [playerId, otherId, matches, wins, losses, items]
                        properties:
                          playerId: { type: string, format: uuid }
                          otherId: { type: string, format: uuid }
                          matches: { type: integer }
                          wins: { type: integer }
                          losses: { type: integer }
                          items: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/me/matches:
    get:
      tags: [match]
      summary: Trận của tôi (sắp tới / đã chốt)
      description: 'Scope: rating:self'
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [history, upcoming] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/MatchPage' }
        default: { $ref: '#/components/responses/Error' }

  /v1/me/tournaments:
    get:
      tags: [tournament]
      summary: Giải của tôi
      description: 'Scope: rating:self'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [tournament, entryStatus, teamId, partnerPlayerId, upcomingMatches, playedMatches, placement]
                              properties:
                                tournament: { $ref: '#/components/schemas/Tournament' }
                                entryStatus: { type: string }
                                teamId: { type: string, nullable: true }
                                partnerPlayerId: { type: string, nullable: true }
                                upcomingMatches: { type: integer }
                                playedMatches: { type: integer }
                                placement:
                                  type: object
                                  nullable: true
                                  properties:
                                    from: { type: integer }
                                    to: { type: integer }
                                    label: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/leaderboards/points:
    get:
      tags: [ranking]
      summary: BXH thành tích — tổng 6 kết quả tốt nhất trong 52 tuần
      description: 'Scope: ranking:read'
      parameters:
        - { name: category, in: query, required: true, schema: { type: string, enum: [MS, WS, MD, WD, XD] } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            required: [category, label]
                            properties:
                              category: { type: string }
                              label: { type: string }
                              items: { type: array, items: { $ref: '#/components/schemas/PointsRow' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [match]
      summary: Chi tiết trận
      description: 'Scope đọc của giải / buổi, hoặc match:score + claim player của người chơi trong trận (màn hình bấm điểm).'
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/call:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Gọi trận ra sân → in_play
      description: |
        Kiểm trên mọi giải / buổi của tenant (plan 20): sân đang có trận → 409 COURT_BUSY; một người của trận đang đánh
        ở sân khác → 409 PLAYER_BUSY. Giải có danh sách sân (courtRefs) thì bắt buộc courtRef thuộc danh sách
        (thiếu → 422 COURT_REQUIRED, ngoài danh sách → 422 COURT_NOT_IN_CONTEXT).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                courtRef: { type: string, maxLength: 64 }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/result:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    put:
      tags: [match]
      summary: Ghi / sửa kết quả trận (kiểm luật BWF; người thắng tự vào trận sau)
      description: 'Scope: tournament:operate (trận giải) hoặc session:operate (trận giao lưu). If-Match bắt buộc.'
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                games:
                  type: array
                  maxItems: 5
                  items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0, maximum: 99 } }
                outcome: { type: string, enum: [normal, walkover, retired] }
                winnerSide: { type: string, enum: [A, B] }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Huỷ trận chưa có kết quả (không áp dụng cho trận trong sơ đồ; trận giao lưu bị huỷ không tính là đã đánh)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [match]
      summary: Tỉ số đang bấm của trận (bấm điểm trực tiếp)
      description: 'Scope đọc của giải / buổi, hoặc match:score của người chơi trong trận. Chưa ai bấm → revision 0, rallies rỗng.'
      responses:
        '200': { $ref: '#/components/responses/MatchLive' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live/rallies:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Bấm +1 điểm cho đội thắng pha cầu
      description: |
        Scope: tournament:operate / session:operate (nhân viên đúng chi nhánh), hoặc match:score + claim player của
        người chơi trong trận (ngoài trận → 403 NOT_A_PARTICIPANT). `revision` = phiên bản tỉ số client đang thấy;
        lệch → 409 LIVE_CONFLICT (tải lại rồi bấm tiếp). Đã đủ điểm thắng → 409 MATCH_DECIDED; trận không còn đang
        đánh → 409 INVALID_STATE.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [side, revision]
              properties:
                side: { type: string, enum: [A, B] }
                revision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/MatchLive' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live/undo:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Hoàn tác điểm vừa bấm (kể cả điểm vừa kết thúc game)
      description: 'Quyền như bấm điểm. Chưa có điểm → 409 NOTHING_TO_UNDO.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, minimum: 0, description: 'Phiên bản tỉ số client đang thấy' }
      responses:
        '200': { $ref: '#/components/responses/MatchLive' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live/server:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    put:
      tags: [match]
      summary: Chọn đội giao trước (chỉ trước điểm đầu tiên)
      description: 'Quyền như bấm điểm. Đã bấm điểm → 409 RALLIES_STARTED.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [firstServer, revision]
              properties:
                firstServer: { type: string, enum: [A, B] }
                revision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/MatchLive' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live/confirm:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Lưu kết quả từ tỉ số đã bấm (cùng đường với ghi kết quả)
      description: |
        Nhân viên: mọi trận. Người chơi trong trận (match:score): chỉ trận KHÔNG tính điểm — trận tính điểm (giải, giao
        lưu bật tính điểm) → 403 CONFIRM_REQUIRES_STAFF. Chưa đủ điểm thắng → 409 MATCH_NOT_DECIDED. Như ghi kết quả:
        tính điểm trình khi chốt / đóng, nhả sân giao lưu, người thắng vào trận sau, sự kiện competition.match.completed.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, minimum: 0, description: 'Phiên bản tỉ số client đang thấy' }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/live/retire:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Không đánh tiếp được — đội side bỏ cuộc giữa trận, đối thủ thắng (plan 20)
      description: |
        Kết quả outcome retired: giữ các game đã xong (game đang dở bỏ), đối thủ thắng; đang ở sơ đồ thì đối thủ đi tiếp.
        Chỉ nhân viên (người chơi → 403 RETIRE_REQUIRES_STAFF). Trận giao lưu → 409 RESULT_NOT_REQUIRED (dùng huỷ trận /
        xong không tỉ số). Đã đủ điểm thắng → 409 MATCH_DECIDED. revision lệch → 409 LIVE_CONFLICT.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [side, revision]
              properties:
                side: { type: string, enum: [A, B], description: 'Đội không đánh tiếp được' }
                revision: { type: integer, minimum: 0, description: 'Phiên bản tỉ số client đang thấy (0 nếu chưa bấm điểm)' }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/advice:
    post:
      tags: [tournament]
      summary: Gợi ý thể thức / số bảng / ước tính số trận và thời gian
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teams]
              properties:
                teams: { type: integer, minimum: 2, maximum: 256 }
                courts: { type: integer, minimum: 1, maximum: 64 }
                matchMinutes: { type: integer, minimum: 1, maximum: 240 }
                format: { type: string, enum: [round_robin, groups_knockout, knockout] }
                groupCount: { type: integer, minimum: 2, maximum: 64 }
                advancePerGroup: { type: integer, enum: [1, 2] }
                thirdPlace: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [format, suggestedFormat, estimate]
                        properties:
                          format: { type: string }
                          suggestedFormat: { type: string }
                          groupCount: { type: integer, nullable: true }
                          groupSizes: { type: array, nullable: true, items: { type: integer } }
                          advancePerGroup: { type: integer, nullable: true }
                          estimate:
                            type: object
                            required: [matches, slots, minutes]
                            properties:
                              matches: { type: integer }
                              slots: { type: integer }
                              minutes: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments:
    post:
      tags: [tournament]
      summary: Tạo giải (nháp)
      description: 'Scope: tournament:manage. organizerRef phải thuộc claim org; tier chain cần org "*".'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentInput' }
      responses:
        '201': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [tournament]
      summary: Danh sách giải (trong phạm vi chi nhánh của token)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, open, drawn, in_progress, finalized, cancelled] } }
        - { name: discipline, in: query, schema: { $ref: '#/components/schemas/Discipline' } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Chi tiết giải + tiến độ
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [tournament]
      summary: Sửa giải (draft / open; đã có người đăng ký thì khoá nội dung / giới / luật điểm / điều kiện trình)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentPatch' }
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/open:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Mở đăng ký (draft → open)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Huỷ giải (không áp điểm)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/reopen:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Huỷ bốc thăm, quay lại mở đăng ký (khi chưa có kết quả)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/entries:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Danh sách đăng ký (kèm điểm xét + cờ trình)
      responses:
        '200': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [tournament]
      summary: Đăng ký người chơi (cặp cố định thì kèm đồng đội)
      description: 'Scope: tournament:operate. Chưa có điểm → 422 NEEDS_ASSESSMENT; sai điều kiện → 422 NOT_ELIGIBLE; hết chỗ → danh sách chờ.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [playerId]
              properties:
                playerId: { type: string, format: uuid }
                partnerPlayerId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/entries/{entryId}:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [tournament]
      summary: Rút (sau bốc thăm cả đội rút, trận chưa đánh thành W.O.)
      responses:
        '200': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/entries/{entryId}/check-in:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tournament]
      summary: Điểm danh ngày thi đấu (từng người; đôi = cả hai người đã điểm danh)
      description: 'Scope: tournament:operate. Giải open / drawn / in_progress. Người đã rút → 409 INVALID_STATE. Gọi lại không đổi giờ điểm danh.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [tournament]
      summary: Bỏ điểm danh (bấm nhầm)
      responses:
        '200': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/entries/{entryId}/partner:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [tournament]
      summary: Đổi đồng đội (đôi cặp sẵn, trước bốc thăm)
      description: |
        Người cũ rời giải, người mới vào đúng chỗ của cặp (cùng trạng thái, cùng thứ tự đăng ký). Kiểm lại điều kiện
        như lúc đăng ký (NEEDS_ASSESSMENT, NOT_ELIGIBLE, ALREADY_REGISTERED). Giải không phải đôi cặp sẵn → 422
        PARTNER_NOT_ALLOWED.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [partnerPlayerId]
              properties:
                partnerPlayerId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EntryList' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/courts:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    put:
      tags: [tournament]
      summary: Sân của giải (sửa được tới khi chốt; bỏ sân đang có trận → 409 COURT_BUSY)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [courtRefs]
              properties:
                courtRefs: { type: array, minItems: 1, maxItems: 32, items: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/no-shows:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Đội vắng — chưa đánh trận nào (không tính trận được W.O.) và chưa đủ người điểm danh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Team' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [tournament]
      summary: Xử W.O. các đội vắng (đi đúng đường rút lui sau bốc thăm)
      description: 'teamIds = các đội BTC đã xem và chọn; bỏ trống = mọi đội vắng. Đội không còn vắng → 409 NOT_ABSENT; không có ai → 422 NOTHING_TO_DO.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                teamIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tournament, teamIds]
                        properties:
                          tournament: { $ref: '#/components/schemas/Tournament' }
                          teamIds: { type: array, items: { type: string, format: uuid } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/next-matches:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Trận kế tiếp cho sân vừa trống + các sân đang trống
      description: |
        Ứng viên: trận đang chờ, đủ hai đội, không ai đang ở sân (mọi giải / buổi). Thứ tự: đã nghỉ đủ (5 phút) trước →
        lượt sớm hơn → đội nghỉ lâu hơn → vòng bảng trước sơ đồ.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [freeCourts, blocked, items]
                        properties:
                          freeCourts: { type: array, nullable: true, items: { type: string }, description: 'null = giải chưa có danh sách sân' }
                          blocked:
                            type: array
                            description: Trận đủ đội nhưng chưa gọi được vì có người đang ở sân (giải này hoặc giải / buổi khác)
                            items:
                              type: object
                              required: [matchId, players]
                              properties:
                                matchId: { type: string, format: uuid }
                                players:
                                  type: array
                                  items:
                                    type: object
                                    required: [id, courtRef]
                                    properties:
                                      id: { type: string, format: uuid }
                                      courtRef: { type: string, nullable: true }
                          items:
                            type: array
                            items:
                              type: object
                              required: [match, restMinutes, rested]
                              properties:
                                match: { $ref: '#/components/schemas/MatchView' }
                                restMinutes: { type: integer, nullable: true, description: 'Người nghỉ ít nhất của trận đã nghỉ bao lâu; null = chưa ai đánh trận nào' }
                                rested: { type: boolean }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/call-next:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Gọi trận kế tiếp ra sân courtRef (cùng kiểm tra như gọi ra sân)
      description: 'Không có trận nào gọi được → 422 NOTHING_TO_CALL.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                courtRef: { type: string, maxLength: 64 }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/draw/preview:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Xem trước bốc thăm — không lưu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seed: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DrawProposal' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/draw:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Xác nhận bốc thăm (bản đã chỉnh tay) → sinh đội, bảng, lịch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seed, teams]
              properties:
                seed: { type: string, maxLength: 64 }
                teams:
                  type: array
                  minItems: 2
                  maxItems: 256
                  items:
                    type: object
                    required: [players]
                    properties:
                      players: { type: array, minItems: 1, maxItems: 2, items: { type: string, format: uuid } }
                groups:
                  type: array
                  items:
                    type: object
                    required: [groupNo, teams]
                    properties:
                      groupNo: { type: integer, minimum: 1 }
                      teams: { type: array, items: { type: integer, minimum: 0 } }
                bracket:
                  type: array
                  nullable: true
                  description: Chỉ thể thức loại trực tiếp — vị trí (chỉ số đội) trong sơ đồ, null = bye
                  items: { type: integer, minimum: 0, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/teams:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Các đội sau bốc thăm
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Team' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/matches:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Lịch thi đấu (theo lượt / bảng / sơ đồ)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [tournament]
      summary: Thêm trận tay (play-off, tranh hạng…)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teamAId, teamBId]
              properties:
                teamAId: { type: string, format: uuid }
                teamBId: { type: string, format: uuid }
                label: { type: string, maxLength: 60 }
      responses:
        '201': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/standings:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Bảng xếp hạng từng bảng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [groups]
                        properties:
                          groups:
                            type: array
                            items:
                              type: object
                              required: [groupNo, rows]
                              properties:
                                groupNo: { type: integer }
                                rows: { type: array, items: { $ref: '#/components/schemas/StandingRow' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/bracket:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Sơ đồ loại trực tiếp theo vòng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [rounds]
                        properties:
                          rounds:
                            type: array
                            items:
                              type: object
                              required: [roundNo, matches]
                              properties:
                                roundNo: { type: integer }
                                matches: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/knockout/preview:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Xem trước sơ đồ loại trực tiếp từ kết quả vòng bảng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [size, positions, teams, firstRound, constraintLevel]
                        properties:
                          size: { type: integer }
                          positions: { type: array, items: { type: string, nullable: true } }
                          teams: { type: object, additionalProperties: { $ref: '#/components/schemas/Team' } }
                          firstRound: { type: array, items: { type: object } }
                          constraintLevel: { type: integer, nullable: true }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/knockout:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Khoá sơ đồ loại trực tiếp (có thể đổi ô)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                positions: { type: array, items: { type: string, format: uuid, nullable: true } }
      responses:
        '200': { $ref: '#/components/responses/TournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/finalize-preview:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Xem trước khi chốt — thứ hạng, điểm trình trước → sau, điểm BXH thành tích
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/FinalizeResult'
                          - type: object
                            required: [ready, pendingMatches, needsKnockout]
                            properties:
                              ready: { type: boolean }
                              pendingMatches: { type: integer }
                              needsKnockout: { type: boolean }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Chốt giải — áp điểm trình, điểm BXH, thống kê trong một transaction
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Đã chốt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/FinalizeResult'
                          - type: object
                            required: [tournament]
                            properties:
                              tournament: { $ref: '#/components/schemas/Tournament' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/unfinalize:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [tournament]
      summary: Huỷ chốt (chỉ khi chưa ai có thay đổi điểm sau giải)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Đã huỷ chốt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tournament, rolledBack]
                        properties:
                          tournament: { $ref: '#/components/schemas/Tournament' }
                          rolledBack: { type: array, items: { type: object } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/placements:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Thứ hạng chung cuộc (sau khi chốt)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Placement' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/tournaments/{id}/stream:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [tournament]
      summary: Luồng SSE — tỉ số trực tiếp các trận đang đánh, báo lịch / bảng đấu đổi
      description: |
        text/event-stream. Sự kiện: `snapshot` khi vừa kết nối ({ serverTime, matches: [{ matchId, courtRef, live }] } —
        trận đang đánh đã có người bấm điểm); `score` mỗi lần bấm / hoàn tác ({ matchId, courtRef, live: MatchLive });
        `board` khi sân / trận / danh sách đổi ({ reason } — client tải lại dữ liệu); `ping` 25 giây một lần.
        Service đóng luồng khi token hết hạn; EventSource tự nối lại (gateway ký token mới).
      responses:
        '200':
          description: Luồng sự kiện — mở tới khi client ngắt hoặc token hết hạn
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/matches/{id}/end:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    post:
      tags: [match]
      summary: Kết thúc trận không nhập tỉ số (chỉ trận giao lưu) → ended, sân được nhả
      description: 'Scope: session:operate. Trận giải → 409 RESULT_REQUIRED. Nhập tỉ số sau đó vẫn được (ended → completed).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Match' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions:
    post:
      tags: [session]
      summary: Tạo buổi giao lưu (mở ngay)
      description: 'Scope: session:operate. organizerRef phải thuộc claim org. Mặc định: đôi, cân bằng, 1 game × 21, không tính điểm.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionInput' }
      responses:
        '201': { $ref: '#/components/responses/SessionDetail' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [session]
      summary: Danh sách buổi giao lưu (trong phạm vi chi nhánh của token)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, cancelled] } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Paged'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Chi tiết buổi + tiến độ (người có mặt, trận, sân trống)
      responses:
        '200': { $ref: '#/components/responses/SessionDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [session]
      summary: Sửa buổi đang mở (đã có trận thì khoá Đơn / Đôi; không bỏ được sân đang có trận)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPatch' }
      responses:
        '200': { $ref: '#/components/responses/SessionDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/players:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Danh sách điểm danh
      responses:
        '200': { $ref: '#/components/responses/SessionRoster' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [session]
      summary: Điểm danh (người đến muộn được bù số trận); chưa có điểm thì gửi kèm quickLevel để chấm nhanh
      description: 'Scope: session:operate (+ rating:assess khi có quickLevel). Chưa có điểm, không quickLevel → 422 NEEDS_ASSESSMENT. Đang có mặt ở buổi khác chưa đóng → 409 PRESENT_ELSEWHERE (errors[].field = id buổi kia).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [playerId]
              properties:
                playerId: { type: string, format: uuid }
                quickLevel: { type: string, enum: [beginner, weak, tb_minus, tb, tb_plus, kha] }
      responses:
        '201': { $ref: '#/components/responses/SessionRoster' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/players/{playerId}:
    parameters:
      - { $ref: '#/components/parameters/SessionId' }
      - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [session]
      summary: Rời buổi (đang ở sân → 409 PLAYER_ON_COURT)
      responses:
        '200': { $ref: '#/components/responses/SessionRoster' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/fill-courts/preview:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [session]
      summary: Xem trước "Xếp sân trống" (không ghi gì); cùng seed + cùng tình trạng → cùng đề xuất
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seed: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FillProposal' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/fill-courts:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [session]
      summary: Xác nhận "Xếp sân trống" → sinh trận đang đánh trên các sân trống
      description: >-
        Gửi lại `assignments` của bản xem trước (có thể đã đổi tay); bỏ trống thì hệ thống tự xếp theo `seed`.
        Sân / người không còn rảnh → 409 FILL_STALE; không có gì để xếp → 422 NOTHING_TO_FILL.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seed: { type: string, maxLength: 64 }
                assignments:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: { $ref: '#/components/schemas/CourtAssignmentInput' }
      responses:
        '201':
          description: Đã xếp
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [round, seed, manualEdits, matches]
                        properties:
                          round: { type: integer }
                          seed: { type: string }
                          manualEdits: { type: boolean }
                          matches: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/matches:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Các trận của buổi theo lượt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/board:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Dữ liệu màn hình lớn (TV) — sân, ai với ai, từ lúc nào; hàng chờ theo thứ tự ưu tiên
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionBoard' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/stream:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Luồng SSE cho màn hình TV — tỉ số trực tiếp, báo màn hình lớn đổi
      description: |
        text/event-stream. Sự kiện: `snapshot` khi vừa kết nối ({ serverTime, matches: [{ matchId, courtRef, live }] } —
        trận đang đánh đã có người bấm điểm); `score` mỗi lần bấm / hoàn tác ({ matchId, courtRef, live: MatchLive });
        `board` khi sân / trận / danh sách đổi ({ reason } — client tải lại dữ liệu); `ping` 25 giây một lần.
        Service đóng luồng khi token hết hạn; EventSource tự nối lại (gateway ký token mới).
      responses:
        '200':
          description: Luồng sự kiện — mở tới khi client ngắt hoặc token hết hạn
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/close-preview:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Xem trước khi đóng buổi — số trận có / chưa có tỉ số, điểm trình trước / sau (nếu bật tính điểm)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionCloseResult' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/close:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [session]
      summary: Đóng buổi — trận chưa có tỉ số bị huỷ; tính điểm hệ số 0.5 nếu bật; cộng thống kê "giao lưu"
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/SessionCloseResult'
                          - type: object
                            required: [session]
                            properties:
                              session: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [session]
      summary: Huỷ buổi — không tính điểm, không vào thống kê
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/SessionDetail' }
        default: { $ref: '#/components/responses/Error' }

  # --- Trang công khai (plan 27): scope public:read — gateway cấp cho cả người chưa đăng nhập ---
  /v1/public/tournaments:
    get:
      tags: [public]
      summary: Danh sách giải xem công khai (open / drawn / in_progress / finalized, mọi chi nhánh)
      description: |
        Scope: public:read. Không kiểm chi nhánh. `status` nhận một hoặc nhiều giá trị cách nhau dấu phẩy; `order` asc
        (mặc định, ngày sớm nhất trước) hoặc desc; `q` tìm trong tên giải. Giải nháp / đã huỷ không bao giờ có trong kết quả.
      parameters:
        - { name: status, in: query, allowReserved: true, schema: { type: string, pattern: '^(open|drawn|in_progress|finalized)(,(open|drawn|in_progress|finalized))*$' } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/PublicTournamentPage' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Chi tiết giải xem công khai (kèm số chỗ, số trận)
      description: 'Scope: public:read. Giải nháp / đã huỷ → 404.'
      responses:
        '200': { $ref: '#/components/responses/PublicTournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/entries:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Danh sách đăng ký (mỗi dòng một người hoặc một cặp), tên theo quyền riêng tư
      description: 'Scope: public:read. Người rút không có trong danh sách. `players[].id = null` khi người chơi bị che tên.'
      responses:
        '200': { $ref: '#/components/responses/PublicEntries' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/matches:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Lịch thi đấu và kết quả
      description: 'Scope: public:read.'
      responses:
        '200': { $ref: '#/components/responses/PublicMatches' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/standings:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Bảng xếp hạng vòng bảng
      description: 'Scope: public:read.'
      responses:
        '200': { $ref: '#/components/responses/PublicStandings' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/bracket:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Sơ đồ loại trực tiếp
      description: 'Scope: public:read.'
      responses:
        '200': { $ref: '#/components/responses/PublicBracket' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/placements:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Thứ hạng cuối giải (sau khi chốt)
      description: 'Scope: public:read.'
      responses:
        '200': { $ref: '#/components/responses/PublicPlacements' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/tournaments/{id}/stream:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    get:
      tags: [public]
      summary: Luồng SSE công khai của giải (tỉ số trực tiếp, báo lịch / bảng đổi)
      description: 'Scope: public:read. Cùng sự kiện và cách đóng khi token hết hạn như /v1/tournaments/{id}/stream; chỉ cho giải được xem công khai.'
      responses:
        '200':
          description: Luồng sự kiện — mở tới khi client ngắt hoặc token hết hạn
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/sessions:
    get:
      tags: [public]
      summary: Danh sách buổi giao lưu xem công khai (đang mở, và đã đóng trong 30 ngày gần đây)
      description: 'Scope: public:read. `status` nhận open và / hoặc closed, cách nhau dấu phẩy. Buổi đã huỷ không có trong kết quả.'
      parameters:
        - { name: status, in: query, allowReserved: true, schema: { type: string, pattern: '^(open|closed)(,(open|closed))*$' } }
        - { name: organizerRef, in: query, allowReserved: true, schema: { type: string, maxLength: 64 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/PublicSessionPage' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [public]
      summary: Chi tiết buổi giao lưu xem công khai
      description: 'Scope: public:read.'
      responses:
        '200': { $ref: '#/components/responses/PublicSessionDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/sessions/{id}/board:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [public]
      summary: Bảng sân công khai — sân đang đánh, người sắp vào sân, hàng chờ, kết quả gần đây
      description: 'Scope: public:read. Tên người chơi theo quyền riêng tư.'
      responses:
        '200': { $ref: '#/components/responses/PublicSessionBoard' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/sessions/{id}/stream:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [public]
      summary: Luồng SSE công khai của buổi giao lưu
      description: 'Scope: public:read. Như /v1/sessions/{id}/stream, chỉ cho buổi được xem công khai.'
      responses:
        '200':
          description: Luồng sự kiện — mở tới khi client ngắt hoặc token hết hạn
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  # --- Khách tự đăng ký giải (plan 27, p1): scope entry:self ---
  /v1/me/tournaments/{id}/entries:
    parameters: [{ $ref: '#/components/parameters/TournamentId' }]
    post:
      tags: [public]
      summary: Khách tự đăng ký giải (kèm đồng đội nếu đôi cặp cố định) — nhận cả hai người trong một lần
      description: |
        Scope: entry:self. Người đăng ký luôn là CHÍNH MÌNH (claim `player` của token; hồ sơ tự tạo lần đầu từ `player_name`).
        Giải đánh đôi cặp cố định bắt buộc `partner`: `playerId` (người đã có hồ sơ mà thành viên thấy được — hồ sơ hidden coi như
        không tồn tại) HOẶC `guest` (người chưa có tài khoản: tên, SĐT, giới tính, mức trình → tạo hồ sơ khách + điểm tạm chưa xác nhận,
        nhân viên xác nhận sau; cùng SĐT dùng lại hồ sơ cũ). Hết chỗ → cả hai vào danh sách chờ. Trả chi tiết giải kèm `me`.
        Lỗi: 404 giải nháp / huỷ; 409 INVALID_STATE (giải không còn mở đăng ký) hoặc ALREADY_REGISTERED; 422 NEEDS_ASSESSMENT,
        NOT_ELIGIBLE, PARTNER_REQUIRED, PARTNER_NOT_ALLOWED, PARTNER_INVALID, INVALID_GUEST, GUEST_LIMIT.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfRegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/PublicTournamentDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [public]
      summary: Khách rút khỏi giải (chỉ trước bốc thăm; giải cặp cố định thì cả cặp rút)
      description: 'Scope: entry:self. Chưa đăng ký → 404 NOT_REGISTERED; giải đã bốc thăm → 409 WITHDRAW_LOCKED (liên hệ nhân viên). Nhường chỗ cho người chờ.'
      responses:
        '200': { $ref: '#/components/responses/PublicTournamentDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/me/partners:
    get:
      tags: [public]
      summary: Tìm đồng đội theo tên (khi đăng ký giải đôi)
      description: 'Scope: entry:self. Tối thiểu 2 ký tự. Chỉ trả người đang hoạt động mà thành viên được thấy (public / members), không có chính mình, không có hồ sơ hidden và hồ sơ khách. `rated` = đã có điểm (chưa có thì đăng ký sẽ bị 422 NEEDS_ASSESSMENT).'
      parameters:
        - { name: search, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        '200': { $ref: '#/components/responses/PartnerSearch' }
        default: { $ref: '#/components/responses/Error' }

  # --- Đăng ký buổi giao lưu online (plan 27, p2): khách scope entry:self; nhân viên session:read / session:operate ---
  /v1/me/sessions/{id}/signup:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [public]
      summary: Khách đăng ký tham gia buổi giao lưu (báo trước "tôi sẽ đến")
      description: |
        Scope: entry:self. Người đăng ký là chính mình (claim `player`). Chỗ = người đã đăng ký giữ chỗ ∪ người đang có mặt, so với
        `maxPlayers` của buổi (null = không giới hạn); hết chỗ → vào danh sách chờ. Điểm danh thật vẫn do nhân viên làm tại quầy
        (khi đó đăng ký thành "đã đến"). Trả chi tiết buổi công khai kèm `me`.
        Lỗi: 404 buổi huỷ / không có; 409 SESSION_CLOSED (buổi đã đóng), ALREADY_SIGNED_UP, ALREADY_PRESENT (đã điểm danh).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/PublicSessionDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [public]
      summary: Khách huỷ đăng ký buổi giao lưu (nhường chỗ cho người chờ)
      description: 'Scope: entry:self. Chưa đăng ký / đã huỷ / đã điểm danh → 404 NOT_SIGNED_UP; buổi đã đóng → 409 SESSION_CLOSED.'
      responses:
        '200': { $ref: '#/components/responses/PublicSessionDetail' }
        default: { $ref: '#/components/responses/Error' }

  /v1/me/sessions:
    get:
      tags: [public]
      summary: Các buổi giao lưu đang mở mà khách đã đăng ký (giữ chỗ hoặc đang chờ)
      description: 'Scope: entry:self. Sắp theo giờ bắt đầu. Buổi đã đóng / đã đến không có.'
      responses:
        '200': { $ref: '#/components/responses/MySessions' }
        default: { $ref: '#/components/responses/Error' }

  /v1/public/sessions/{id}/signups:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [public]
      summary: Ai đã đăng ký buổi giao lưu (giữ chỗ / đang chờ / đã đến), tên theo quyền riêng tư
      description: 'Scope: public:read. Người đã huỷ không có. Người đã đăng ký / có mặt trong buổi thấy tên đầy đủ của nhau.'
      responses:
        '200': { $ref: '#/components/responses/PublicSessionSignups' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/signups:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [session]
      summary: Danh sách đăng ký online của buổi (nhân viên) — để điểm danh nhanh tại quầy
      description: 'Scope: session:read. Điểm danh vẫn là `POST /v1/sessions/{id}/players` (đăng ký tự thành attended). `rating` null = chưa có điểm → điểm danh phải kèm quickLevel.'
      responses:
        '200': { $ref: '#/components/responses/StaffSignups' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/signups/{signupId}:
    parameters:
      - { $ref: '#/components/parameters/SessionId' }
      - { name: signupId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [session]
      summary: Nhân viên gỡ một đăng ký online (người không đến, đăng ký nhầm, spam)
      description: 'Scope: session:operate. Chỉ gỡ được đăng ký đang giữ chỗ / chờ (đã huỷ / đã điểm danh → 409). Nhường chỗ cho người chờ.'
      responses:
        '200': { $ref: '#/components/responses/StaffSignups' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256)
    eventSignature:
      type: apiKey
      in: header
      name: X-Signature

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Cùng key + cùng body → trả lại đúng response cũ; cùng key + khác body → 422.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    PlayerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalRef:
      name: externalRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ExternalRefValue' }
    MatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TournamentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Version hiện tại (ETag). Ghi kết quả trận bắt buộc có — thiếu → 412, lệch → 409.'
      schema: { type: string, pattern: '^"?[0-9]+"?$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }

  responses:
    Error:
      description: Lỗi (envelope có `code`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Player:
      description: Hồ sơ người chơi
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PlayerView' }
    AssessmentSubmitted:
      description: Đã ghi nhận bài chấm
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [assessment, result, player]
                    properties:
                      assessment: { $ref: '#/components/schemas/Assessment' }
                      result: { $ref: '#/components/schemas/AssessmentResultOrNull' }
                      player: { $ref: '#/components/schemas/PlayerView' }
    Match:
      description: Trận
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/MatchView' }
    MatchLive:
      description: Tỉ số đang bấm
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/MatchLive' }
    MatchPage:
      description: Danh sách trận
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paged'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
    TournamentDetail:
      description: Giải (kèm tiến độ)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
    EntryList:
      description: Danh sách đăng ký
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Entry' } }
    SessionDetail:
      description: Buổi giao lưu (kèm tiến độ)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
    SessionRoster:
      description: Danh sách điểm danh
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SessionPlayer' } }
    Rubric:
      description: Bộ tiêu chí
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Rubric' }

    PublicTournamentPage:
      description: Danh sách giải xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paged'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PublicTournament' } }
    PublicTournamentDetail:
      description: Giải xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicTournament' }
    PublicEntries:
      description: Danh sách đăng ký xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PublicEntry' } }
    PublicMatches:
      description: Lịch và kết quả xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PublicMatchView' } }
    PublicStandings:
      description: Bảng vòng bảng xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [groups]
                    properties:
                      groups: { type: array, items: { $ref: '#/components/schemas/PublicStandingGroup' } }
    PublicBracket:
      description: Sơ đồ loại trực tiếp xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [rounds]
                    properties:
                      rounds:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [roundNo, matches]
                          properties:
                            roundNo: { type: integer }
                            matches: { type: array, items: { $ref: '#/components/schemas/PublicMatchView' } }
    PublicPlacements:
      description: Thứ hạng cuối giải xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PublicPlacement' } }
    PublicSessionPage:
      description: Danh sách buổi giao lưu xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paged'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PublicSession' } }
    PublicSessionDetail:
      description: Buổi giao lưu xem công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicSession' }
    PublicSessionBoard:
      description: Bảng sân công khai
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicSessionBoard' }

    PartnerSearch:
      description: Người có thể chọn làm đồng đội
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PartnerCandidate' } }

    PublicSessionSignups:
      description: Ai đã đăng ký buổi giao lưu (xem công khai)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PublicSessionSignupEntry' } }
    MySessions:
      description: Buổi giao lưu đang mở mà khách đã đăng ký
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MySession' } }
    StaffSignups:
      description: Đăng ký online của buổi (nhân viên)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/StaffSignup' } }

  schemas:
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data: { description: 'Dữ liệu trả về (null khi không có)' }
        message: { type: string, nullable: true }
        errors: { type: array, nullable: true, items: { $ref: '#/components/schemas/FieldError' } }
        code: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, data, message, code, errors]
      properties:
        success: { type: boolean, enum: [false] }
        data: { description: 'Luôn null khi lỗi' }
        message: { type: string }
        code: { type: string }
        errors: { type: array, nullable: true, items: { $ref: '#/components/schemas/FieldError' } }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Paged:
      type: object
      required: [items, total, page, totalPages]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }

    ExternalRefValue:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9:_.-]{0,127}$'
    Discipline: { type: string, enum: [singles, doubles] }
    Gender: { type: string, enum: [male, female] }

    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        nickname: { type: string, nullable: true, maxLength: 30 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthYear: { type: integer, nullable: true }
        dominantHand: { type: string, nullable: true, enum: [right, left, null] }
        playingSinceYear: { type: integer, nullable: true }
        sessionsPerWeek: { type: integer, nullable: true }
        preferredPlay: { type: string, nullable: true, enum: [singles, doubles, both, null] }
        doublesPosition: { type: string, nullable: true, enum: [front, back, both, null] }
        homeOrganizerRef: { type: string, nullable: true, maxLength: 64 }
        visibility: { type: string, enum: [public, members, hidden] }

    Answers:
      type: object
      description: Mức 1–5 cho từng tiêu chí của rubric (thiếu tiêu chí → 422 INVALID_ANSWERS)
      additionalProperties: false
      properties:
        serve: { $ref: '#/components/schemas/Level' }
        clear: { $ref: '#/components/schemas/Level' }
        backhand: { $ref: '#/components/schemas/Level' }
        smash: { $ref: '#/components/schemas/Level' }
        drop: { $ref: '#/components/schemas/Level' }
        net: { $ref: '#/components/schemas/Level' }
        defense: { $ref: '#/components/schemas/Level' }
        footwork: { $ref: '#/components/schemas/Level' }
        stamina: { $ref: '#/components/schemas/Level' }
        tactics: { $ref: '#/components/schemas/Level' }
        rotation: { $ref: '#/components/schemas/Level' }
        experience: { $ref: '#/components/schemas/Level' }
    AnswersNullable:
      type: object
      description: Như Answers nhưng cho phép null ở tiêu chí AI chưa chấm được
      additionalProperties: false
      properties:
        serve: { $ref: '#/components/schemas/LevelNullable' }
        clear: { $ref: '#/components/schemas/LevelNullable' }
        backhand: { $ref: '#/components/schemas/LevelNullable' }
        smash: { $ref: '#/components/schemas/LevelNullable' }
        drop: { $ref: '#/components/schemas/LevelNullable' }
        net: { $ref: '#/components/schemas/LevelNullable' }
        defense: { $ref: '#/components/schemas/LevelNullable' }
        footwork: { $ref: '#/components/schemas/LevelNullable' }
        stamina: { $ref: '#/components/schemas/LevelNullable' }
        tactics: { $ref: '#/components/schemas/LevelNullable' }
        rotation: { $ref: '#/components/schemas/LevelNullable' }
        experience: { $ref: '#/components/schemas/LevelNullable' }
    Level: { type: integer, minimum: 1, maximum: 5 }
    LevelNullable: { type: integer, minimum: 1, maximum: 5, nullable: true }

    ScoreItem:
      type: object
      required: [raw, rating, level, cappedBy]
      properties:
        raw: { type: number }
        rating: { type: number }
        level: { type: string }
        cappedBy: { type: string, nullable: true }
    AssessmentResult: &assessmentResult
      type: object
      required: [singles, doubles, needsVerification, gate]
      properties:
        singles: { $ref: '#/components/schemas/ScoreItem' }
        doubles: { $ref: '#/components/schemas/ScoreItem' }
        needsVerification: { type: boolean }
        gate:
          type: object
          nullable: true
          required: [criterion, level, cap]
          properties:
            criterion: { type: string }
            level: { type: integer }
            cap: { type: number, nullable: true }

    Assessment: &assessment
      type: object
      required: [id, playerId, source, status, rubricVersion, answers, needsVerification, submittedByRef, createdAt]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        source: { type: string, enum: [self, staff, staff_quick, video_ai] }
        status: { type: string, enum: [applied, recorded, pending_review, rejected, superseded] }
        rubricVersion: { type: string, nullable: true }
        answers: { type: object }
        confidence: { type: object, nullable: true }
        result: { type: object, nullable: true }
        needsVerification: { type: boolean }
        submittedByRef: { type: string }
        reviewedByRef: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNote: { type: string, nullable: true }
        evidenceRef: { type: string, nullable: true }
        matchId: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    RatingView: &ratingView
      type: object
      additionalProperties: false
      required: [rating, level, levelCode, ratedMatches, reliability, provisional, verified, pairingRating, lastMatchAt]
      properties:
        rating: { type: number, minimum: 1, maximum: 7 }
        level: { type: string }
        levelCode: { type: string }
        ratedMatches: { type: integer, minimum: 0 }
        reliability: { type: integer, minimum: 0, maximum: 100 }
        provisional: { type: boolean }
        verified: { type: boolean }
        pairingRating: { type: number }
        lastMatchAt: { type: string, format: date-time, nullable: true }
    Ratings: &ratings
      type: object
      additionalProperties: false
      required: [singles, doubles]
      properties:
        singles: { $ref: '#/components/schemas/RatingViewOrNull' }
        doubles: { $ref: '#/components/schemas/RatingViewOrNull' }
    RatingViewOrNull: { <<: *ratingView, nullable: true }
    RatingsOrNull: { <<: *ratings, nullable: true }
    AssessmentOrNull: { <<: *assessment, nullable: true }
    AssessmentResultOrNull: { <<: *assessmentResult, nullable: true }
    RankingPosition:
      type: object
      additionalProperties: false
      required: [eligible, rank, total, movement, projectedRank]
      properties:
        eligible: { type: boolean }
        rank: { type: integer, nullable: true }
        total: { type: integer }
        movement: { type: integer, nullable: true }
        projectedRank: { type: integer, nullable: true }
    RankingPositions:
      type: object
      additionalProperties: false
      properties:
        MS: { $ref: '#/components/schemas/RankingPosition' }
        WS: { $ref: '#/components/schemas/RankingPosition' }
        MD: { $ref: '#/components/schemas/RankingPosition' }
        WD: { $ref: '#/components/schemas/RankingPosition' }

    PlayerView:
      type: object
      additionalProperties: false
      required: [id, externalRef, displayName, nickname, publicName, gender, visibility, status, version, ratings]
      properties:
        id: { type: string, format: uuid }
        externalRef: { type: string, nullable: true }
        displayName: { type: string }
        nickname: { type: string, nullable: true }
        publicName: { type: string }
        contactPhone: { type: string, nullable: true, description: 'Hồ sơ khách đăng ký online (plan 27): SĐT do khách nhập, dạng 0xxxxxxxxx' }
        source: { type: string, nullable: true, enum: [online_guest, null], description: 'online_guest = hồ sơ khách do người đăng ký online tạo; null = từ app chính / nhân viên' }
        gender: { type: string, nullable: true, enum: [male, female, null] }
        birthYear: { type: integer, nullable: true }
        ageGroup: { type: string, nullable: true }
        dominantHand: { type: string, nullable: true }
        playingSinceYear: { type: integer, nullable: true }
        sessionsPerWeek: { type: integer, nullable: true }
        preferredPlay: { type: string, nullable: true }
        doublesPosition: { type: string, nullable: true }
        homeOrganizerRef: { type: string, nullable: true }
        visibility: { type: string, enum: [public, members, hidden] }
        status: { type: string, enum: [active, merged, anonymized] }
        mergedIntoPlayerId: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        ratings: { $ref: '#/components/schemas/Ratings' }
        flags:
          type: array
          items: { type: string, enum: [unverified, needs_verification, quick, pending_review] }
        latestAssessment:
          type: object
          nullable: true
          required: [id, source, status, rubricVersion, needsVerification, createdAt]
          properties:
            id: { type: string, format: uuid }
            source: { type: string }
            status: { type: string }
            rubricVersion: { type: string, nullable: true }
            needsVerification: { type: boolean }
            createdAt: { type: string, format: date-time }
        ranking:
          type: object
          additionalProperties: false
          required: [rating, points]
          properties:
            rating: { $ref: '#/components/schemas/RankingPositions' }
            points: { $ref: '#/components/schemas/PointsPositions' }

    PlayerPublicView:
      type: object
      additionalProperties: false
      required: [id, name, ratings]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nickname: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        ageGroup: { type: string, nullable: true }
        dominantHand: { type: string, nullable: true }
        playingSinceYear: { type: integer, nullable: true }
        preferredPlay: { type: string, nullable: true }
        doublesPosition: { type: string, nullable: true }
        homeOrganizerRef: { type: string, nullable: true }
        ratings: { $ref: '#/components/schemas/RatingsOrNull' }
        ranking:
          type: object
          nullable: true
          properties:
            rating: { $ref: '#/components/schemas/RankingPositions' }
            points: { $ref: '#/components/schemas/PointsPositions' }

    RatingChange:
      type: object
      additionalProperties: false
      required: [id, discipline, before, after, delta, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        discipline: { $ref: '#/components/schemas/Discipline' }
        before: { type: number, nullable: true }
        after: { type: number }
        delta: { type: number }
        reason: { type: string, enum: [assessment, tournament, session, adjustment, rollback, merge] }
        assessmentId: { type: string, nullable: true }
        contextType: { type: string, nullable: true }
        contextId: { type: string, nullable: true }
        note: { type: string, nullable: true }
        calc: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }

    LeaderboardRow:
      type: object
      additionalProperties: false
      required: [rank, movement, player, rating, level, levelCode, ratedMatches, verified, isMe]
      properties:
        rank: { type: integer }
        movement: { type: integer, nullable: true }
        player:
          type: object
          additionalProperties: false
          required: [id, name, masked]
          properties:
            id: { type: string, nullable: true }
            name: { type: string }
            nickname: { type: string, nullable: true }
            masked: { type: boolean }
        rating: { type: number }
        level: { type: string }
        levelCode: { type: string }
        ratedMatches: { type: integer }
        verified: { type: boolean }
        isMe: { type: boolean }

    Rubric:
      type: object
      required: [version, pages, profileQuestions, criteria]
      properties:
        version: { type: string }
        instructions: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [page, title]
            properties:
              page: { type: integer }
              title: { type: string }
        profileQuestions: { type: array, items: { type: object } }
        criteria:
          type: array
          items:
            type: object
            required: [code, page, name, weights, gate, anchors]
            properties:
              code: { type: string }
              page: { type: integer }
              name: { type: string }
              gate: { type: boolean }
              weights:
                type: object
                required: [singles, doubles]
                properties:
                  singles: { type: number }
                  doubles: { type: number }
              anchors:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  type: object
                  required: [level, text]
                  properties:
                    level: { type: integer }
                    text: { type: string }
        verificationTrigger: { type: object }

    PlayerStats:
      type: object
      additionalProperties: false
      required: [discipline, context, matches, wins, losses, winRate, gamesWon, gamesLost, pointsWon, pointsLost, streak, last5, tournaments, titles, runnerUps, semis, bestRating, bestRatingAt]
      properties:
        discipline: { $ref: '#/components/schemas/Discipline' }
        context: { type: string, enum: [tournament, session] }
        matches: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number, nullable: true }
        gamesWon: { type: integer }
        gamesLost: { type: integer }
        pointsWon: { type: integer }
        pointsLost: { type: integer }
        streak: { type: integer, description: 'Dương = thắng liền, âm = thua liền' }
        last5: { type: array, items: { type: string, enum: [W, L] } }
        tournaments: { type: integer }
        titles: { type: integer }
        runnerUps: { type: integer }
        semis: { type: integer }
        bestRating: { type: number, nullable: true }
        bestRatingAt: { type: string, format: date-time, nullable: true }

    MatchTeam:
      type: object
      nullable: true
      required: [teamId, players]
      properties:
        teamId: { type: string, nullable: true, description: 'Đội của giải; null với trận giao lưu' }
        players:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, nullable: true }
    MatchLive:
      type: object
      nullable: true
      additionalProperties: false
      description: 'Bấm điểm trực tiếp (docs/06 mục 1.5) — tính lại từ chuỗi pha cầu. Trong MatchView: null = chưa ai bấm điểm.'
      required: [matchId, revision, rallies, firstServer, games, current, gameNo, gamesWon, server, serveFrom, endsSwapped, decided, winnerSide, updatedAt]
      properties:
        matchId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0, description: 'Tăng ở mọi lần đổi (kể cả hoàn tác) — gửi kèm khi bấm tiếp' }
        rallies: { type: string, pattern: '^[AB]*$', maxLength: 1000, description: 'Đội thắng từng pha cầu, theo thứ tự' }
        firstServer: { type: string, enum: [A, B] }
        games:
          type: array
          description: Các game đã xong
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0 } }
        current:
          type: array
          nullable: true
          description: 'Game đang đánh [A, B]; null khi đã xong trận'
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 0 }
        gameNo: { type: integer, minimum: 1 }
        gamesWon: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0 } }
        server: { type: string, nullable: true, enum: [A, B, null], description: 'Đội đang giao (đội thắng pha trước)' }
        serveFrom: { type: string, nullable: true, enum: [right, left, null], description: 'Điểm của đội giao chẵn → ô phải, lẻ → ô trái' }
        endsSwapped: { type: boolean, description: 'Hai đội đang ở ngược đầu sân so với lúc bắt đầu trận. Đổi sân khi hết một game mà trận còn tiếp, và ở game quyết định của trận nhiều game khi đội dẫn chạm nửa số điểm game (11 với 21, 8 với 15); trận 1 game không đổi. Màn hình bấm điểm đổi bên theo trường này' }
        decided: { type: boolean, description: 'Đã đủ điểm thắng trận — chỉ còn xác nhận hoặc hoàn tác' }
        winnerSide: { type: string, nullable: true, enum: [A, B, null] }
        updatedAt: { type: string, format: date-time, nullable: true }

    MatchView: &matchView
      type: object
      additionalProperties: false
      required: [id, contextType, contextId, discipline, stage, teamA, teamB, scoring, games, outcome, winnerSide, status, live, version]
      properties:
        id: { type: string, format: uuid }
        contextType: { type: string, enum: [tournament, session] }
        contextId: { type: string, format: uuid }
        discipline: { $ref: '#/components/schemas/Discipline' }
        stage: { type: string, enum: [group, knockout, extra, session] }
        label: { type: string, nullable: true }
        groupNo: { type: integer, nullable: true }
        roundNo: { type: integer, nullable: true }
        slotNo: { type: integer, nullable: true }
        bracketPos: { type: integer, nullable: true }
        nextMatchId: { type: string, nullable: true }
        teamA: { $ref: '#/components/schemas/MatchTeam' }
        teamB: { $ref: '#/components/schemas/MatchTeam' }
        scoring: { $ref: '#/components/schemas/ScoringObject' }
        games: { type: array, items: { type: array, items: { type: integer } } }
        outcome: { type: string, nullable: true, enum: [normal, walkover, retired, null] }
        winnerSide: { type: string, nullable: true, enum: [A, B, null] }
        status: { type: string, enum: [scheduled, in_play, completed, cancelled, ended], description: 'ended = xong không nhập tỉ số (giao lưu)' }
        courtRef: { type: string, nullable: true }
        calledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        live: { $ref: '#/components/schemas/MatchLive' }
        version: { type: integer }
        expectedTime: { type: string, nullable: true, description: 'Lịch giải: giờ dự kiến HH:MM của lượt (giải có giờ bắt đầu)' }

    ScoringObject:
      type: object
      required: [bestOf, points]
      properties:
        bestOf: { type: integer, enum: [1, 3, 5] }
        points: { type: integer, minimum: 5, maximum: 50 }
        cap: { type: integer, nullable: true }
    Scoring:
      description: Preset ('3x21', '1x21', '3x15', '1x31') hoặc tuỳ chỉnh
      oneOf:
        - { type: string, enum: ['3x21', '1x21', '3x15', '1x31'] }
        - $ref: '#/components/schemas/ScoringObject'
    RatingRule:
      type: object
      nullable: true
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [player, team_sum] }
        min: { type: number, nullable: true, minimum: 1, maximum: 14 }
        max: { type: number, nullable: true, minimum: 1, maximum: 14 }

    TournamentPatch:
      type: object
      additionalProperties: false
      properties: &tournamentProps
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 5000 }
        startsOn: { type: string, format: date }
        startTime: { type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Giờ bắt đầu HH:MM (giờ chi nhánh) — giờ dự kiến từng lượt' }
        tier: { type: string, enum: [club, open, chain] }
        discipline: { $ref: '#/components/schemas/Discipline' }
        genderRule: { type: string, enum: [open, men, women, mixed] }
        pairingMode: { type: string, enum: [fixed, random_balanced] }
        maxPartnerGap: { type: number, nullable: true, minimum: 0, maximum: 6 }
        maxEntries: { type: integer, nullable: true, minimum: 2, maximum: 512 }
        checkInRequired: { type: boolean, description: 'Bốc thăm tại sân: chỉ lấy người đã điểm danh (đôi cặp sẵn cần cả hai)' }
        courtRefs: { type: array, nullable: true, minItems: 1, maxItems: 32, items: { type: string, minLength: 1, maxLength: 64 }, description: 'Sân của giải; có thì courtCount = số sân' }
        ratingRule: { $ref: '#/components/schemas/RatingRule' }
        format: { type: string, enum: [round_robin, groups_knockout, knockout] }
        groupCount: { type: integer, nullable: true, minimum: 1, maximum: 64 }
        groupMode: { type: string, enum: [seeded, level] }
        advancePerGroup: { type: integer, nullable: true, enum: [1, 2, null] }
        thirdPlaceMatch: { type: boolean }
        scoring: { $ref: '#/components/schemas/Scoring' }
        courtCount: { type: integer, minimum: 1, maximum: 64 }
        matchMinutes: { type: integer, minimum: 5, maximum: 240 }
        rated: { type: boolean }
        ranked: { type: boolean }
    TournamentInput:
      type: object
      additionalProperties: false
      required: [organizerRef, name, startsOn, tier, discipline, genderRule, format, scoring]
      properties:
        <<: *tournamentProps
        organizerRef: { type: string, minLength: 1, maxLength: 64 }

    Tournament:
      type: object
      required: [id, organizerRef, name, startsOn, tier, discipline, genderRule, pairingMode, format, scoring, status, version]
      properties:
        id: { type: string, format: uuid }
        organizerRef: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        startsOn: { type: string, format: date }
        startTime: { type: string, nullable: true }
        tier: { type: string, enum: [club, open, chain] }
        discipline: { $ref: '#/components/schemas/Discipline' }
        genderRule: { type: string, enum: [open, men, women, mixed] }
        pairingMode: { type: string, enum: [fixed, random_balanced] }
        maxPartnerGap: { type: number, nullable: true }
        maxEntries: { type: integer, nullable: true }
        checkInRequired: { type: boolean }
        ratingRule: { $ref: '#/components/schemas/RatingRule' }
        format: { type: string, enum: [round_robin, groups_knockout, knockout] }
        groupCount: { type: integer, nullable: true }
        groupMode: { type: string, enum: [seeded, level] }
        advancePerGroup: { type: integer, nullable: true }
        thirdPlaceMatch: { type: boolean }
        scoring: { $ref: '#/components/schemas/ScoringObject' }
        courtCount: { type: integer }
        courtRefs: { type: array, nullable: true, items: { type: string }, description: 'null = giải tạo trước plan 20, chỉ có số sân' }
        matchMinutes: { type: integer }
        rated: { type: boolean }
        ranked: { type: boolean }
        drawSeed: { type: string, nullable: true }
        status: { type: string, enum: [draft, open, drawn, in_progress, finalized, cancelled] }
        stage: { type: string, nullable: true, enum: [group, knockout, null] }
        finalizedAt: { type: string, format: date-time, nullable: true }
        createdByRef: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          properties:
            entries:
              type: object
              properties:
                registered: { type: integer }
                waitlisted: { type: integer }
                withdrawn: { type: integer }
                checkedIn: { type: integer, description: 'Người chưa rút đã điểm danh' }
            matches:
              type: object
              properties:
                total: { type: integer }
                completed: { type: integer }

    Entry:
      type: object
      additionalProperties: false
      required: [id, playerId, name, gender, partnerPlayerId, status, waitlistReason, rating, pairingRating, flags, registeredAt, checkedInAt]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        partnerPlayerId: { type: string, nullable: true }
        status: { type: string, enum: [registered, waitlisted, withdrawn] }
        waitlistReason: { type: string, nullable: true, enum: [capacity, draw, absent, null], description: 'absent = vắng lúc bốc thăm tại sân' }
        rating: { type: number, nullable: true }
        pairingRating: { type: number, nullable: true }
        flags: { type: array, items: { type: string } }
        registeredAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, nullable: true, description: 'Điểm danh ngày thi đấu' }

    Team:
      type: object
      required: [id, players, teamRating, groupNo, seed, withdrawn]
      properties:
        id: { type: string, format: uuid }
        players:
          type: array
          items:
            type: object
            required: [id, name, gender]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              gender: { type: string, nullable: true }
        teamRating: { type: number }
        groupNo: { type: integer, nullable: true }
        seed: { type: integer, nullable: true }
        withdrawn: { type: boolean }
        groupRank: { type: integer }

    DrawProposal:
      type: object
      additionalProperties: false
      required: [seed, teams, waitlist, absent, groups, bracket, matches, estimate, stats]
      properties:
        seed: { type: string }
        teams:
          type: array
          items:
            type: object
            required: [index, players, teamRating]
            properties:
              index: { type: integer }
              teamRating: { type: number }
              players:
                type: array
                items:
                  type: object
                  required: [id, name, gender, pairingRating]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string, nullable: true }
                    gender: { type: string, nullable: true }
                    pairingRating: { type: number }
        waitlist:
          type: array
          items:
            type: object
            required: [playerId, name, reason]
            properties:
              playerId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              reason: { type: string, enum: [ODD_COUNT, GENDER_IMBALANCE] }
        absent:
          type: array
          description: Đã đăng ký nhưng chưa điểm danh (giải bốc thăm tại sân) — không vào bốc thăm, xác nhận thì sang danh sách chờ (absent)
          items:
            type: object
            required: [playerId, name]
            properties:
              playerId: { type: string, format: uuid }
              name: { type: string, nullable: true }
        groups:
          type: array
          items:
            type: object
            required: [groupNo, teams]
            properties:
              groupNo: { type: integer }
              teams: { type: array, items: { type: integer } }
              pots: { type: array, items: { type: integer, nullable: true } }
        bracket: { type: array, nullable: true, items: { type: integer, nullable: true } }
        matches:
