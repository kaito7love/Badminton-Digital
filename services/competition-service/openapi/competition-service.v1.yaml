      required: [id, organizerRef, name, description, startsOn, startTime, tier, discipline, genderRule, pairingMode, maxEntries, ratingRule, format, groupCount, advancePerGroup, thirdPlaceMatch, scoring, courtCount, matchMinutes, rated, ranked, status, stage, finalizedAt, registration]
      properties:
