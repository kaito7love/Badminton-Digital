              after: { type: number }
              delta: { type: number }
              matches: { type: integer }
        rankingEligible: { type: boolean }
        rankingReason: { type: string, nullable: true }
        rankingPoints:
          type: array
          items:
            type: object
            required: [playerId, name, category, placement, points]
            properties:
              playerId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              category: { type: string, enum: [MS, WS, MD, WD, XD] }
              placement: { type: string }
              points: { type: integer }

    PointsRow:
      type: object
      additionalProperties: false
      required: [rank, movement, player, points, countedResults, rating, level, isMe, results]
      properties:
        rank: { type: integer }
        movement: { type: integer, nullable: true }
        player:
          type: object
          additionalProperties: false
          required: [id, name, masked]
          properties:
            id: { type: string, nullable: true }
            name: { type: string }
            nickname: { type: string, nullable: true }
            masked: { type: boolean }
        points: { type: integer }
        countedResults: { type: integer }
        rating: { type: number, nullable: true }
        level: { type: string, nullable: true }
        isMe: { type: boolean }
        results:
          type: array
          items:
            type: object
            required: [tournamentId, tournament, placement, points, awardedAt, expiresAt]
            properties:
              tournamentId: { type: string }
              tournament: { type: string }
              placement: { type: string }
              points: { type: integer }
              awardedAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
    PointsPosition:
      type: object
      additionalProperties: false
      required: [rank, total, points, countedResults]
      properties:
        rank: { type: integer }
        total: { type: integer }
        points: { type: integer }
        countedResults: { type: integer }
    PointsPositions:
      type: object
      additionalProperties: false
      properties:
        MS: { $ref: '#/components/schemas/PointsPosition' }
        WS: { $ref: '#/components/schemas/PointsPosition' }
        MD: { $ref: '#/components/schemas/PointsPosition' }
        WD: { $ref: '#/components/schemas/PointsPosition' }
        XD: { $ref: '#/components/schemas/PointsPosition' }
    MatchViewOrNull: { <<: *matchView, nullable: true }
    SessionPatch:
      type: object
      additionalProperties: false
      properties: &sessionProps
        name: { type: string, minLength: 3, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        courtRefs:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        format: { type: string, enum: [doubles, singles] }
        mode: { type: string, enum: [balanced, level, random], description: 'balanced = đội cân trong từng sân; level = cùng trình vào cùng sân; random = ngẫu nhiên, chỉ tránh lặp đồng đội' }
        scoring: { $ref: '#/components/schemas/Scoring' }
        rated: { type: boolean, description: 'Tính điểm trình khi đóng buổi (hệ số 0.5). Mặc định tắt.' }
        maxPlayers: { type: integer, nullable: true, minimum: 2, maximum: 200, description: 'Sức chứa cho đăng ký online (chỗ = đã đăng ký giữ chỗ ∪ đang có mặt); null = không giới hạn. Tăng / bỏ sức chứa thì người chờ được lên.' }
    SessionInput:
      type: object
      additionalProperties: false
      required: [organizerRef, name, courtRefs]
      properties:
        <<: *sessionProps
        organizerRef: { type: string, maxLength: 64 }
        seed: { type: string, maxLength: 64 }
    Session:
      type: object
      required: [id, organizerRef, name, startsAt, courtRefs, format, mode, scoring, rated, seed, rounds, status, version]
      properties:
        id: { type: string, format: uuid }
        organizerRef: { type: string }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        courtRefs: { type: array, items: { type: string } }
        format: { type: string, enum: [doubles, singles] }
        mode: { type: string, enum: [balanced, level, random] }
        scoring: { $ref: '#/components/schemas/ScoringObject' }
        rated: { type: boolean }
        seed: { type: string }
        maxPlayers: { type: integer, nullable: true }
        rounds: { type: integer, description: 'Số lần "Xếp sân trống" đã xác nhận' }
        status: { type: string, enum: [open, closed, cancelled] }
        closedAt: { type: string, format: date-time, nullable: true }
        createdByRef: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          properties:
            players:
              type: object
              properties:
                present: { type: integer }
                left: { type: integer }
            matches:
              type: object
              properties:
                total: { type: integer }
                inPlay: { type: integer }
                completed: { type: integer }
                ended: { type: integer }
            freeCourts: { type: integer }
            signups:
              type: object
              description: 'Đăng ký online (plan 27)'
              properties:
                registered: { type: integer }
                waitlisted: { type: integer }
    PlayerName:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
    SessionPlayer:
      type: object
      additionalProperties: false
      required: [playerId, name, status, joinedAt, gamesPlayed, gamesCredit, onCourt]
      properties:
        playerId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        status: { type: string, enum: [present, left] }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
        gamesPlayed: { type: integer }
        gamesCredit: { type: integer, description: 'Số trận được bù khi đến muộn (chỉ dùng để xếp ưu tiên)' }
        waitingSince: { type: string, format: date-time, nullable: true }
        onCourt: { type: string, nullable: true, description: 'Mã sân đang đánh' }
        rating: { type: number, nullable: true }
        pairingRating: { type: number, nullable: true }
        flags: { type: array, items: { type: string } }
    CourtAssignmentInput:
      description: Một sân trong bản xác nhận — gửi lại nguyên văn phần tử assignments của bản xem trước (có thể đã đổi tay)
      type: object
      additionalProperties: false
      required: [court, sideA, sideB]
      properties:
        court: { type: string, maxLength: 64 }
        sideA: { type: array, minItems: 1, maxItems: 2, items: { type: string, format: uuid } }
        sideB: { type: array, minItems: 1, maxItems: 2, items: { type: string, format: uuid } }
        teamRatings: { type: array, items: { type: number }, description: 'Có trong bản xem trước — gửi lại nguyên văn được, server bỏ qua' }
        repeatPartners: { type: integer, description: 'Như trên' }
    FillProposal:
      type: object
      additionalProperties: false
      required: [seed, round, freeCourts, assignments, waiting, players]
      properties:
        seed: { type: string }
        round: { type: integer }
        freeCourts: { type: array, items: { type: string } }
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [court, sideA, sideB, teamRatings, repeatPartners]
            properties:
              court: { type: string }
              sideA: { type: array, items: { type: string, format: uuid } }
              sideB: { type: array, items: { type: string, format: uuid } }
              teamRatings: { type: array, items: { type: number } }
              repeatPartners: { type: integer, description: 'Số lần các cặp đồng đội này đã đánh cùng nhau trong buổi' }
        waiting: { type: array, items: { type: string, format: uuid } }
        players:
          type: object
          description: 'Tên / điểm / số trận ưu tiên theo id người chơi'
          additionalProperties:
            type: object
            required: [name, pairingRating, effectiveGames]
            properties:
              name: { type: string, nullable: true }
              pairingRating: { type: number }
              effectiveGames: { type: integer }
    SessionBoard:
      type: object
      additionalProperties: false
      required: [session, serverTime, courts, upcoming, queue, recent, counts]
      properties:
        session:
          type: object
          required: [id, name, status, format, mode, rated, rounds]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            status: { type: string, enum: [open, closed, cancelled] }
            format: { type: string, enum: [doubles, singles] }
            mode: { type: string, enum: [balanced, level, random] }
            rated: { type: boolean }
            rounds: { type: integer }
        serverTime: { type: string, format: date-time }
        courts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [courtRef, status, match]
            properties:
              courtRef: { type: string }
              status: { type: string, enum: [busy, free] }
              match: { $ref: '#/components/schemas/MatchViewOrNull' }
        upcoming:
          type: array
          description: 'Sẽ vào các sân đang trống nếu bấm "Xếp sân trống" ngay (cùng hàm, cùng seed của lượt tới). Rỗng khi không có sân trống hoặc chưa đủ người.'
          items:
            type: object
            additionalProperties: false
            required: [courtRef, sideA, sideB]
            properties:
              courtRef: { type: string }
              sideA: { type: array, items: { $ref: '#/components/schemas/PlayerName' } }
              sideB: { type: array, items: { $ref: '#/components/schemas/PlayerName' } }
        queue:
          type: array
          description: 'Người có mặt đang rảnh, đúng thứ tự ưu tiên của thuật toán xếp sân (ít trận nhất → chờ lâu nhất → đến sớm).'
          items:
            type: object
            additionalProperties: false
            required: [position, playerId, name, gamesPlayed, waitingSince, next]
            properties:
              position: { type: integer }
              playerId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              gamesPlayed: { type: integer }
              waitingSince: { type: string, format: date-time, nullable: true }
              next: { type: boolean, description: 'Nằm trong upcoming — chỉ có khi đang có sân trống; không có sân trống thì không hứa ai vào lượt tới' }
        recent: { type: array, items: { $ref: '#/components/schemas/MatchView' } }
        counts:
          type: object
          required: [present, onCourt, waiting]
          properties:
            present: { type: integer }
            onCourt: { type: integer }
            waiting: { type: integer }
    SessionCloseResult:
      type: object
      required: [rated, completedMatches, unscoredMatches, ratingChanges]
      properties:
        rated: { type: boolean }
        completedMatches: { type: integer }
        unscoredMatches: { type: integer, description: 'Trận chưa có tỉ số — bị huỷ khi đóng buổi' }
        ratingChanges:
          type: array
          items:
            type: object
            required: [playerId, before, after, delta, matches]
            properties:
              playerId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              before: { type: number }
              after: { type: number }
              delta: { type: number }
              matches: { type: integer }

    # --- Trang công khai (plan 27). Mọi schema đóng (`additionalProperties: false`): thêm trường nội bộ vào dữ liệu công khai
    # mà quên khai ở đây thì test hợp đồng đỏ — chặn rò rỉ từ sớm.
    PublicPlayerRef:
      type: object
      additionalProperties: false
      required: [id, name, masked]
      properties:
        id: { type: string, format: uuid, nullable: true, description: 'null khi người chơi bị che theo quyền riêng tư — không mở được hồ sơ' }
        name: { type: string, description: 'Tên theo quyền riêng tư; bị che thì "Thành viên A3F2" (mã suy từ id, ổn định)' }
        masked: { type: boolean }
